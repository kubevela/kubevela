# B00: parent with a defaulted replicas
# expect: accepted
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "b-base"
  namespace: "vela-system"
spec:
  workload:
    definition:
      apiVersion: "apps/v1"
      kind: "Deployment"
    type: "deployments.apps"
  schematic:
    cue:
      template: |
        output: {
        	apiVersion: "apps/v1"
        	kind:       "Deployment"
        	metadata: name: context.name
        	spec: {
        		replicas: parameter.replicas
        		selector: matchLabels: "app.oam.dev/component": context.name
        		template: {
        			metadata: labels: "app.oam.dev/component": context.name
        			spec: {
        				securityContext: {runAsNonRoot: true}
        				containers: [{name: context.name, image: parameter.image}]
        			}
        		}
        	}
        }
        outputs: {
        	svc: {
        		apiVersion: "v1"
        		kind:       "Service"
        		metadata: name: context.name
        		spec: {
        			selector: "app.oam.dev/component": context.name
        			ports: [{port: 8080}]
        		}
        	}
        	netpol: {
        		apiVersion: "networking.k8s.io/v1"
        		kind:       "NetworkPolicy"
        		metadata: name: context.name
        		spec: podSelector: matchLabels: "app.oam.dev/component": context.name
        	}
        }
        parameter: {
        	image:    string
        	replicas: *1 | int
        }
---
# B01: child sets replicas: 5
# expect: refused, with: component b-replicas sets output.spec.replicas, which b-base already sets
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "b-replicas"
  namespace: "vela-system"
spec:
  extends: "b-base"
  schematic:
    cue:
      template: |
        parameter: image: *"nginxinc/nginx-unprivileged:stable" | string
        $super: properties: {image: parameter.image}
        output: spec: replicas: 5
---
# B02: child restates the default replicas: 1
# expect: refused, with: sets output.spec.replicas
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "b-default"
  namespace: "vela-system"
spec:
  extends: "b-base"
  schematic:
    cue:
      template: |
        parameter: image: *"nginxinc/nginx-unprivileged:stable" | string
        $super: properties: {image: parameter.image}
        output: spec: replicas: 1
---
# B03: child changes the concrete kind
# expect: refused, with: component b-kind sets output.kind, but b-base fixes it to "Deployment" and a child cannot change it; to use another value, write a definition that does not extend b-base
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "b-kind"
  namespace: "vela-system"
spec:
  extends: "b-base"
  schematic:
    cue:
      template: |
        parameter: image: *"nginxinc/nginx-unprivileged:stable" | string
        $super: properties: {image: parameter.image}
        output: kind: "StatefulSet"
---
# B04: child restates the same apiVersion and kind
# expect: accepted
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "b-same"
  namespace: "vela-system"
spec:
  extends: "b-base"
  schematic:
    cue:
      template: |
        parameter: image: *"nginxinc/nginx-unprivileged:stable" | string
        $super: properties: {image: parameter.image}
        output: {apiVersion: "apps/v1", kind: "Deployment"}
---
# B05: child changes the container image (from a required parameter: judged at render)
# expect: accepted
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "b-image"
  namespace: "vela-system"
spec:
  extends: "b-base"
  schematic:
    cue:
      template: |
        parameter: image: *"nginxinc/nginx-unprivileged:stable" | string
        $super: properties: {image: parameter.image}
        output: spec: template: spec: containers: [{image: "busybox"}]
---
# B05: child changes the container image (from a required parameter: judged at render)
# expect: refused, with: sets output.spec.template.spec.containers[0].image, which b-base already sets
apiVersion: "core.oam.dev/v1beta1"
kind: "Application"
metadata:
  name: "b-image-app"
  namespace: "default"
spec:
  components:
    - name: "b-img"
      type: "b-image"
---
# B06: child adds resources to containers[0]
# expect: accepted
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "b-resources"
  namespace: "vela-system"
spec:
  extends: "b-base"
  schematic:
    cue:
      template: |
        parameter: image: *"nginxinc/nginx-unprivileged:stable" | string
        $super: properties: {image: parameter.image}
        output: spec: template: spec: containers: [{resources: limits: memory: "128Mi"}]
---
# B07: child changes the port of the kept svc output
# expect: refused, with: sets outputs.svc.spec.ports[0].port, but b-base fixes it to 8080
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "b-svc"
  namespace: "vela-system"
spec:
  extends: "b-base"
  schematic:
    cue:
      template: |
        parameter: image: *"nginxinc/nginx-unprivileged:stable" | string
        $super: properties: {image: parameter.image}
        outputs: svc: spec: ports: [{port: 9090}]
---
# B07b: child adds spec.type, which the parent left unset, to the svc output
# expect: accepted
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "b-svc-type"
  namespace: "vela-system"
spec:
  extends: "b-base"
  schematic:
    cue:
      template: |
        parameter: image: *"nginxinc/nginx-unprivileged:stable" | string
        $super: properties: {image: parameter.image}
        outputs: svc: spec: type: "NodePort"
---
# B08: child passes replicas through $super
# expect: accepted
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "b-passes"
  namespace: "vela-system"
spec:
  extends: "b-base"
  schematic:
    cue:
      template: |
        parameter: image: *"nginxinc/nginx-unprivileged:stable" | string
        $super: properties: {image: parameter.image, replicas: 3}
---
# B09: grandchild sets replicas through a silent middle
# expect: accepted
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "b-middle"
  namespace: "vela-system"
spec:
  extends: "b-base"
  schematic:
    cue:
      template: |
        parameter: image: *"nginxinc/nginx-unprivileged:stable" | string
        $super: properties: {image: parameter.image}
---
# B09: grandchild sets replicas through a silent middle
# expect: refused, with: component b-leaf sets output.spec.replicas
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "b-leaf"
  namespace: "vela-system"
spec:
  extends: "b-middle"
  schematic:
    cue:
      template: |
        parameter: image: *"nginxinc/nginx-unprivileged:stable" | string
        $super: properties: {image: parameter.image}
        output: spec: replicas: 5
---
# B10: app: the accepted children render
# expect: accepted
apiVersion: "core.oam.dev/v1beta1"
kind: "Application"
metadata:
  name: "b-app"
  namespace: "default"
spec:
  components:
    - name: "b-res"
      type: "b-resources"
    - name: "b-three"
      type: "b-passes"
