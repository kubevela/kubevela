# E00: parent whose healthPolicy reads netpol
# expect: accepted
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "e-base"
  namespace: "vela-system"
spec:
  workload:
    definition:
      apiVersion: "apps/v1"
      kind: "Deployment"
    type: "deployments.apps"
  status:
    healthPolicy: |
      isHealth: context.output.status.readyReplicas == context.output.spec.replicas && context.outputs.netpol != _|_
  schematic:
    cue:
      template: |
        output: {
        	apiVersion: "apps/v1"
        	kind:       "Deployment"
        	metadata: name: context.name
        	spec: {
        		replicas: parameter.replicas
        		selector: matchLabels: "app.oam.dev/component": context.name
        		template: {
        			metadata: labels: "app.oam.dev/component": context.name
        			spec: {
        				securityContext: {runAsNonRoot: true}
        				containers: [{name: context.name, image: parameter.image}]
        			}
        		}
        	}
        }
        outputs: {
        	svc: {
        		apiVersion: "v1"
        		kind:       "Service"
        		metadata: name: context.name
        		spec: {
        			selector: "app.oam.dev/component": context.name
        			ports: [{port: 8080}]
        		}
        	}
        	netpol: {
        		apiVersion: "networking.k8s.io/v1"
        		kind:       "NetworkPolicy"
        		metadata: name: context.name
        		spec: podSelector: matchLabels: "app.oam.dev/component": context.name
        	}
        }
        parameter: {
        	image:    string
        	replicas: *1 | int
        }
---
# E01: child drops netpol
# expect: refused, with: component e-drops leaves out outputs.netpol, which the healthPolicy it inherits from e-base reads
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "e-drops"
  namespace: "vela-system"
spec:
  extends: "e-base"
  schematic:
    cue:
      template: |
        parameter: image: *"nginxinc/nginx-unprivileged:stable" | string
        $super: properties: {image: parameter.image}
        $inherit: {outputs: {netpol: false}}
---
# E02: child drops netpol and adds a health policy (still combined)
# expect: refused, with: healthPolicy it inherits
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "e-adds"
  namespace: "vela-system"
spec:
  extends: "e-base"
  status:
    healthPolicy: |
      isHealth: true
  schematic:
    cue:
      template: |
        parameter: image: *"nginxinc/nginx-unprivileged:stable" | string
        $super: properties: {image: parameter.image}
        $inherit: {outputs: {netpol: false}}
---
# E03: child drops netpol and takes the health policy over
# expect: accepted
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "e-takes"
  namespace: "vela-system"
spec:
  extends: "e-base"
  status:
    healthPolicy: |
      $inherit: false
      isHealth: context.output.status.readyReplicas == context.output.spec.replicas
  schematic:
    cue:
      template: |
        parameter: image: *"nginxinc/nginx-unprivileged:stable" | string
        $super: properties: {image: parameter.image}
        $inherit: {outputs: {netpol: false}}
---
