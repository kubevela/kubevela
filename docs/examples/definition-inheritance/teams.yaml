# What teams build on the platform's types. Each only adds; everything the
# platform guarantees stays as it is.
#
# payments-web: the payments team's flavour. Its own parameters, three replicas
# passed up to platform-web, team labels, and a ConfigMap recording the image
# platform-web actually rendered (read back through $super.output).
apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
  name: payments-web
  namespace: vela-system
spec:
  extends: platform-web
  schematic:
    cue:
      template: |
        parameter: {
        	image:  *"nginxinc/nginx-unprivileged:stable" | string
        	tenant: string
        }
        // What platform-web receives. Replicas change here, never by writing
        // output.spec.replicas.
        $super: properties: {
        	image:    parameter.image
        	replicas: 3
        }
        output: metadata: labels: team: "payments"
        output: spec: template: metadata: labels: tenant: parameter.tenant
        outputs: config: {
        	apiVersion: "v1"
        	kind:       "ConfigMap"
        	metadata: name: context.name + "-config"
        	data: image: $super.output.spec.template.spec.containers[0].image
        }
---
# checkout-web: the checkout service, built on payments-web, so platform-web
# two levels up. It adds an environment variable and a memory limit to the
# container, and a health check of its own, which is combined with the one it
# inherits.
apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
  name: checkout-web
  namespace: vela-system
spec:
  extends: payments-web
  status:
    healthPolicy: |
      isHealth: context.outputs.service.spec.clusterIP != ""
  schematic:
    cue:
      template: |
        parameter: tenant: string
        $super: properties: tenant: parameter.tenant
        output: spec: template: spec: containers: [{
        	env: [{name: "CHECKOUT_MODE", value: "live"}]
        	resources: limits: memory: "256Mi"
        }]
---
# public-web: reachable from the ingress controller. It leaves out
# platform-web's default-deny NetworkPolicy and writes its own. The inherited
# status message reads that policy, so it says its own message too.
apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
  name: public-web
  namespace: vela-system
spec:
  extends: platform-web
  status:
    customStatus: |
      message: "ingress: from ingress-nginx"
  schematic:
    cue:
      template: |
        parameter: image: string
        $super: properties: image: parameter.image
        $inherit: outputs: netpol: false
        outputs: netpol: {
        	apiVersion: "networking.k8s.io/v1"
        	kind:       "NetworkPolicy"
        	metadata: name: context.name
        	spec: {
        		podSelector: matchLabels: "app.oam.dev/component": context.name
        		policyTypes: ["Ingress"]
        		ingress: [{from: [{namespaceSelector: matchLabels: "kubernetes.io/metadata.name": "ingress-nginx"}]}]
        	}
        }
---
# legacy-web: pinned to the first revision of platform-web. When the platform
# team changes platform-web, legacy-web keeps rendering what v1 rendered.
apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
  name: legacy-web
  namespace: vela-system
spec:
  extends: platform-web@v1
  schematic:
    cue:
      template: |
        parameter: image: string
        $super: properties: image: parameter.image
---
# internal-expose: platform-expose with the internal ingress class and an
# allowlist. A trait extends a trait the same way.
apiVersion: core.oam.dev/v1beta1
kind: TraitDefinition
metadata:
  name: internal-expose
  namespace: vela-system
spec:
  extends: platform-expose
  appliesToWorkloads: ["deployments.apps"]
  schematic:
    cue:
      template: |
        parameter: host: string
        $super: properties: host: parameter.host
        outputs: ingress: {
        	metadata: annotations: "nginx.ingress.kubernetes.io/whitelist-source-range": "10.0.0.0/8"
        	spec: ingressClassName: "internal"
        }
---
# team-volume: teams pick a tier, which becomes the storage class. The class is
# immutable in platform-volume, so changing the tier of a running volume is
# refused, although the field the team changes is called tier.
apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
  name: team-volume
  namespace: vela-system
spec:
  extends: platform-volume
  schematic:
    cue:
      template: |
        parameter: {
        	tier: "fast" | "standard"
        	size: *"10Gi" | string
        }
        $super: properties: {
        	storageClass: parameter.tier
        	size:         parameter.size
        }
