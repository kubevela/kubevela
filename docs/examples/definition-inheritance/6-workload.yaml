# F00: parent declares Deployment
# expect: accepted
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "f-base"
  namespace: "vela-system"
spec:
  workload:
    definition:
      apiVersion: "apps/v1"
      kind: "Deployment"
    type: "deployments.apps"
  schematic:
    cue:
      template: |
        output: {
        	apiVersion: "apps/v1"
        	kind:       "Deployment"
        	metadata: name: context.name
        	spec: {
        		replicas: parameter.replicas
        		selector: matchLabels: "app.oam.dev/component": context.name
        		template: {
        			metadata: labels: "app.oam.dev/component": context.name
        			spec: {
        				securityContext: {runAsNonRoot: true}
        				containers: [{name: context.name, image: parameter.image}]
        			}
        		}
        	}
        }
        outputs: {
        	svc: {
        		apiVersion: "v1"
        		kind:       "Service"
        		metadata: name: context.name
        		spec: {
        			selector: "app.oam.dev/component": context.name
        			ports: [{port: 8080}]
        		}
        	}
        	netpol: {
        		apiVersion: "networking.k8s.io/v1"
        		kind:       "NetworkPolicy"
        		metadata: name: context.name
        		spec: podSelector: matchLabels: "app.oam.dev/component": context.name
        	}
        }
        parameter: {
        	image:    string
        	replicas: *1 | int
        }
---
# F01: child declares StatefulSet
# expect: refused, with: component f-sts declares workload apps/v1 StatefulSet, but f-base declares apps/v1 Deployment
