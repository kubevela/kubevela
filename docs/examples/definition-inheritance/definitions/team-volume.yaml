# Storage. platform-volume fixes the storage class once a volume exists:
# +immutable. team-volume lets teams pick a tier, which it maps onto the class,
# so the class stays fixed through it: changing the tier of a running volume is
# refused.
apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
  name: platform-volume
  namespace: vela-system
spec:
  workload:
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
  schematic:
    cue:
      template: |
        output: {
        	apiVersion: "v1"
        	kind:       "PersistentVolumeClaim"
        	metadata: name: context.name
        	spec: {
        		accessModes: ["ReadWriteOnce"]
        		storageClassName: parameter.storageClass
        		resources: requests: storage: parameter.size
        	}
        }
        parameter: {
        	// +immutable
        	storageClass: string
        	size:         *"10Gi" | string
        }
---
apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
  name: team-volume
  namespace: vela-system
spec:
  extends: platform-volume
  schematic:
    cue:
      template: |
        parameter: {
        	tier: "fast" | "standard"
        	size: *"10Gi" | string
        }
        $super: properties: {
        	storageClass: parameter.tier
        	size:         parameter.size
        }
