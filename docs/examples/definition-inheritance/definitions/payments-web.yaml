# The payments team's flavour of platform-web: its own pinned image by default,
# team and cost-centre metadata, and three replicas. Everything else, including
# the non-root pod and the Service, is platform-web's.
apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
  name: payments-web
  namespace: vela-system
  annotations:
    definition.oam.dev/description: platform-web for the payments team
spec:
  extends: platform-web
  schematic:
    cue:
      template: |
        parameter: {
        	image:  *"nginxinc/nginx-unprivileged:1.27" | string
        	tenant: string
        }
        // What platform-web receives. Replicas go up here, never by
        // writing output.spec.replicas.
        $super: properties: {
        	image:    parameter.image
        	replicas: 3
        }
        output: metadata: {
        	labels: team: "payments"
        	annotations: "example.com/cost-centre": "cc-4410"
        }
        output: spec: template: metadata: labels: {
        	team:   "payments"
        	tenant: parameter.tenant
        }
