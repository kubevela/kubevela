# A public-facing service. It keeps platform-web's Deployment and Service, but
# leaves out the default-deny NetworkPolicy and writes one that admits traffic
# from the ingress controller's namespace.
apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
  name: public-web
  namespace: vela-system
  annotations:
    definition.oam.dev/description: platform-web reachable through the ingress controller
spec:
  extends: platform-web
  schematic:
    cue:
      template: |
        parameter: image: string
        $super: properties: image: parameter.image
        $inherit: outputs: netpol: false
        outputs: netpol: {
        	apiVersion: "networking.k8s.io/v1"
        	kind:       "NetworkPolicy"
        	metadata: name: context.name
        	spec: {
        		podSelector: matchLabels: "app.oam.dev/component": context.name
        		policyTypes: ["Ingress"]
        		ingress: [{from: [{namespaceSelector: matchLabels: "kubernetes.io/metadata.name": "ingress-nginx"}]}]
        	}
        }
