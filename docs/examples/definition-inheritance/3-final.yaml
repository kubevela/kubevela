# C00: parent with a +final securityContext
# expect: accepted
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "c-base"
  namespace: "vela-system"
spec:
  workload:
    definition:
      apiVersion: "apps/v1"
      kind: "Deployment"
    type: "deployments.apps"
  schematic:
    cue:
      template: |
        output: {
        	apiVersion: "apps/v1"
        	kind:       "Deployment"
        	metadata: name: context.name
        	spec: {
        		replicas: parameter.replicas
        		selector: matchLabels: "app.oam.dev/component": context.name
        		template: {
        			metadata: labels: "app.oam.dev/component": context.name
        			spec: {
        				// +final
        				securityContext: {runAsNonRoot: true}
        				containers: [{name: context.name, image: parameter.image}]
        			}
        		}
        	}
        }
        outputs: {
        	svc: {
        		apiVersion: "v1"
        		kind:       "Service"
        		metadata: name: context.name
        		spec: {
        			selector: "app.oam.dev/component": context.name
        			ports: [{port: 8080}]
        		}
        	}
        	netpol: {
        		apiVersion: "networking.k8s.io/v1"
        		kind:       "NetworkPolicy"
        		metadata: name: context.name
        		spec: podSelector: matchLabels: "app.oam.dev/component": context.name
        	}
        }
        parameter: {
        	image:    string
        	replicas: *1 | int
        }
---
# C01: child adds fsGroup to securityContext
# expect: refused, with: component c-adds adds to output.spec.template.spec.securityContext, which c-base marks +final
apiVersion: "core.oam.dev/v1beta1"
kind: "ComponentDefinition"
metadata:
  name: "c-adds"
  namespace: "vela-system"
spec:
  extends: "c-base"
  schematic:
    cue:
      template: |
        parameter: image: *"nginxinc/nginx-unprivileged:stable" | string
        $super: properties: {image: parameter.image}
        output: spec: template: spec: securityContext: fsGroup: 2000
---
# C02: child restates runAsNonRoot
