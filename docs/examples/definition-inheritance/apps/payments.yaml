apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: payments
  namespace: default
spec:
  components:
    - name: checkout
      type: checkout-web
      properties:
        tenant: acme
      traits:
        - type: internal-expose
          properties:
            host: checkout.internal.example.com
    - name: ledger
      type: payments-web
      properties:
        image: nginxinc/nginx-unprivileged:stable
        tenant: acme
