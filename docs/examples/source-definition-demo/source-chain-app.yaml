apiVersion: core.oam.dev/v1beta1
kind: SourceDefinition
metadata:
  name: cluster-source
  namespace: default
  annotations:
    # Generated by inference from the context this template reads.
    definition.oam.dev/cache-key-rules: "6ac674fa"
    definition.oam.dev/cache-key-rules-version: v1
spec:
  schematic:
    cue:
      template: |
        schema: {
          nested: {
            image: {
              repo: string
              tag:  string
            }
            meta: region: string
          }
        }
        output: {
          nested: {
            image: {
              repo: parameter.repo
              tag:  parameter.tag
            }
            meta: {
              region: parameter.region
            }
          }
        }
        parameter: {
          repo:   string
          tag:    string
          region: string
        }
        // Generated, not authored: this template reads no context, so the
        // source is unkeyed and its entries are separated by properties alone.
        $internal: {
          key: "cluster-source"
          keyInputs: []
        }
---
apiVersion: core.oam.dev/v1beta1
kind: SourceDefinition
metadata:
  name: render-source
  namespace: default
  annotations:
    # Generated from the context this template reads; admission re-derives
    # them and rejects a mismatch.
    definition.oam.dev/cache-key-rules: "6ac674fa"
    definition.oam.dev/cache-key-rules-version: v1
spec:
  schematic:
    cue:
      template: |
        schema: {
          resolved: {
            image:  string
            region: string
          }
        }
        output: {
          resolved: {
            image: "\(parameter.repo):\(parameter.tag)"
            region: parameter.region
          }
        }
        parameter: {
          repo:   string
          tag:    string
          region: string
        }
        // Generated, not authored: this template reads no context, so the
        // source is unkeyed and its entries are separated by properties alone.
        $internal: {
          key: "render-source"
          keyInputs: []
        }
---
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: source-chain-app
  annotations:
    app.oam.dev/cel-expressions: "true"
  namespace: default
spec:
  sources:
    - name: clusterInfo
      type: cluster-source
      properties:
        repo: nginx
        tag: "1.25.2"
        region: us-east-1
      statusPolicy:
        exposeConsumedValues: true
        maskPaths:
          - nested.image.tag
    - name: rendered
      type: render-source
      properties:
        repo:
          '$(source.clusterInfo.nested.image.repo)'
        tag:
          '$(source.clusterInfo.nested.image.tag)'
        region:
          '$(source.clusterInfo.nested.meta.region)'
  components:
    - name: web-chain
      type: webservice
      properties:
        image:
          '$(source.rendered.resolved.image)'
        port: 80
        env:
          # clusterInfo masks nested.image.tag, so status records this read as
          # *** while the container still receives the real value.
          - name: IMAGE_TAG
            value: '$(source.clusterInfo.nested.image.tag)'
      traits:
        - type: scaler
          properties:
            replicas: 3
