apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: store-deploy
  namespace: default
spec:
  components:
    - name: store
      type: module
      properties:
        module: store
        registry: modules
        version: "1.0.0"
        # Clusters for objects marked runtime. Definitions and hub objects
        # stay on the hub. Set clusters or clusterLabelSelector, not both.
        # clusterLabelSelector: {} matches every cluster.
        placement:
          clusters:
            - spoke
