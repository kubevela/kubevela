# W-BAD: impossible nodeSelector → Pending / FailedScheduling
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: reg-w-bad
  namespace: default
  labels:
    regression.kubevela.io/suite: addon-scheduling
    regression.kubevela.io/case: W-BAD
spec:
  components:
    - name: reg-w-bad
      type: webservice
      properties:
        image: rancher/mirrored-pause:3.6
      traits:
        - type: affinity
          properties:
            nodeSelector:
              disktype: nvme-does-not-exist
