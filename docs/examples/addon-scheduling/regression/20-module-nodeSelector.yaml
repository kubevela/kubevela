# M-NS: type: module + nodeSelector → aux controller Deployment
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: reg-m-ns
  namespace: vela-system
  labels:
    regression.kubevela.io/suite: addon-scheduling
    regression.kubevela.io/case: M-NS
spec:
  components:
    - name: ctrl-kit
      type: module
      properties:
        module: ctrl-kit
        registry: local-modules
        version: "1.0.0"
      traits:
        - type: affinity
          properties:
            nodeSelector:
              disktype: ssd
              node-type: infra
