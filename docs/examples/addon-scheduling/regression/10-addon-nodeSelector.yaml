# A-NS: type: addon + nodeSelector (declarative EnableAddonComponent)
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: reg-a-ns
  namespace: vela-system
  labels:
    regression.kubevela.io/suite: addon-scheduling
    regression.kubevela.io/case: A-NS
spec:
  components:
    - name: sched-demo
      type: addon
      properties:
        addon: sched-demo
        registry: local-addons
        version: "1.0.0"
      traits:
        - type: affinity
          properties:
            nodeSelector:
              disktype: ssd
              node-type: infra
