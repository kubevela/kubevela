# W-NONE: baseline webservice without affinity (any node OK)
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: reg-w-none
  namespace: default
  labels:
    regression.kubevela.io/suite: addon-scheduling
    regression.kubevela.io/case: W-NONE
spec:
  components:
    - name: reg-w-none
      type: webservice
      properties:
        image: rancher/mirrored-pause:3.6
