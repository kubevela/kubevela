# W-COMBO: nodeSelector + raw affinity + tolerations together
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: reg-w-combo
  namespace: default
  labels:
    regression.kubevela.io/suite: addon-scheduling
    regression.kubevela.io/case: W-COMBO
spec:
  components:
    - name: reg-w-combo
      type: webservice
      properties:
        image: rancher/mirrored-pause:3.6
      traits:
        - type: affinity
          properties:
            nodeSelector:
              disktype: ssd
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-type
                          operator: In
                          values: ["infra"]
            tolerations:
              - key: dedicated
                operator: Exists
                effect: NoSchedule
