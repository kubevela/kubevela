# A-COMBO: type: addon + nodeSelector + raw affinity + tolerations
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: reg-a-combo
  namespace: vela-system
  labels:
    regression.kubevela.io/suite: addon-scheduling
    regression.kubevela.io/case: A-COMBO
spec:
  components:
    - name: sched-demo
      type: addon
      properties:
        addon: sched-demo
        registry: local-addons
        version: "1.0.0"
      traits:
        - type: affinity
          properties:
            nodeSelector:
              disktype: ssd
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-type
                          operator: In
                          values: ["infra"]
            tolerations:
              - key: dedicated
                operator: Exists
                effect: NoSchedule
