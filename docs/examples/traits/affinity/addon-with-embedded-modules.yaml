# Addon that embeds modules inline (modules/ under the addon package).
# Those render as k8s-objects whose primary object is an Application, not as
# separate type: module children. Affinity on the outer type: addon walks that
# owned Application and upserts itself onto its components (Application walk).
#
# kit-suite-inline ships definitions and ConfigMaps only (no controller
# Deployment). Use this to exercise the Application walk / trait upsert path.
# For scheduling on a real controller Deployment, see addon.yaml
# (kube-state-metrics) or a module with aux controllers (module.yaml).
#
# Prerequisites:
# - Enable the feature gate (off by default):
#     --set featureGates.enableAddonComponent=true
#   or controller flag --feature-gates=EnableAddonComponent=true
# - Local addon registry hosting kit-suite-inline (see e2e addon module testdata).
# Replace registry/addon/version for your environment.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: addon-with-embedded-modules
  namespace: vela-system
spec:
  components:
    - name: kit-suite-inline
      type: addon
      properties:
        addon: kit-suite-inline
        registry: local-addons
        version: "1.0.0"
      traits:
        - type: affinity
          properties:
            nodeSelector:
              disktype: ssd
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-type
                          operator: In
                          values:
                            - infra
