# Addon that embeds modules inline (modules/ under the addon package).
# Those render as k8s-objects whose primary object is an Application, not as
# separate type: module children. Affinity on the outer type: addon walks that
# owned Application and overlays auxiliary controller Deployments inside it.
#
# Prerequisites: local addon registry hosting kit-suite-inline (see e2e addon
# module testdata). Replace registry/addon/version for your environment.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: addon-with-embedded-modules
  namespace: vela-system
spec:
  components:
    - name: kit-suite-inline
      type: addon
      properties:
        addon: kit-suite-inline
        registry: local-addons
        version: "1.0.0"
      traits:
        - type: affinity
          properties:
            nodeSelector:
              disktype: ssd
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-type
                          operator: In
                          values:
                            - infra
