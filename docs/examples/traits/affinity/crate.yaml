# Declarative crate with affinity trait (EnableCrateComponent).
# Trait overlays PodSpec fields on auxiliary controllers in the owned Application
# (e.g. Crossplane provider Deployments), not on definitions-only objects.
#
# Prerequisites:
# - Enable the feature gate (off by default):
#     --set featureGates.enableCrateComponent=true
#   or controller flag --feature-gates=EnableCrateComponent=true
# - An OCI crate registry that publishes `widget-kit` (this example uses a local
#   registry named `local-crates`). Crate resolution expects an OCI endpoint,
#   not a plain HTTP Helm chart repo. Register it with `vela crate registry add`
#   (or the equivalent ConfigMap) before applying.
# Replace `registry` / `crate` / `version` for your environment.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: affinity-crate-example
  namespace: vela-system
spec:
  components:
    - name: widget-kit
      type: crate
      properties:
        crate: widget-kit
        registry: local-crates
        version: "1.1.0"
      traits:
        - type: affinity
          properties:
            nodeSelector:
              disktype: ssd
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-type
                          operator: In
                          values:
                            - infra
