# W-NS: normal webservice + nodeSelector → infra/ssd node
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: reg-w-ns
  namespace: default
  labels:
    regression.kubevela.io/suite: affinity
    regression.kubevela.io/case: W-NS
spec:
  components:
    - name: reg-w-ns
      type: webservice
      properties:
        image: rancher/mirrored-pause:3.6
      traits:
        - type: affinity
          properties:
            nodeSelector:
              disktype: ssd
              node-type: infra
