# M-NA: type: module + wrapped nodeAffinity
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: reg-m-na
  namespace: vela-system
  labels:
    regression.kubevela.io/suite: affinity
    regression.kubevela.io/case: M-NA
spec:
  components:
    - name: ctrl-kit
      type: module
      properties:
        module: ctrl-kit
        registry: local-modules
        version: "1.0.0"
      traits:
        - type: affinity
          properties:
            nodeAffinity:
              required:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-type
                        values: ["infra"]
                      - key: disktype
                        values: ["ssd"]
