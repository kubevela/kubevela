# W-TOL: webservice + tolerations only (no taints on nodes → still schedules)
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: reg-w-tol
  namespace: default
  labels:
    regression.kubevela.io/suite: affinity
    regression.kubevela.io/case: W-TOL
spec:
  components:
    - name: reg-w-tol
      type: webservice
      properties:
        image: rancher/mirrored-pause:3.6
      traits:
        - type: affinity
          properties:
            tolerations:
              - key: dedicated
                operator: Exists
                effect: NoSchedule
