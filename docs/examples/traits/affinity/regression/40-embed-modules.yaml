# E-EMBED: addon with embedded modules + outer affinity
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: reg-embed
  namespace: vela-system
  labels:
    regression.kubevela.io/suite: affinity
    regression.kubevela.io/case: E-EMBED
spec:
  components:
    - name: kit-suite-inline
      type: addon
      properties:
        addon: kit-suite-inline
        registry: local-addons
        version: "1.0.0"
      traits:
        - type: affinity
          properties:
            nodeSelector:
              disktype: ssd
              node-type: infra
