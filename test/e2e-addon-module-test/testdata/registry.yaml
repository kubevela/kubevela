# The two in-cluster registries this suite publishes into. Both are anonymous
# and plain HTTP, exposed on fixed NodePorts so the same URL resolves from the
# test process (the vela CLI publishes and pushes from there) and from the
# vela-core pod (the controller fetches from there).
#
# oci-registry is the very same Deployment/Service test/e2e-module-test uses
# for modules (same names, same NodePort), so the two suites share one module
# registry whichever runs first; applyManifestFile ignores AlreadyExists.
#
# chartmuseum holds the addons. The addon side cannot use the OCI registry
# over plain HTTP: the controller reads an OCI addon registry through
# component.PullOCIChart/ListOCITags with TLS (pkg/addon/versioned_registry.go),
# and "vela addon registry add --type oci" insists on an oci:// endpoint, so an
# http:// registry can only be registered as a Helm repository. ChartMuseum is
# the Helm repository the rest of the e2e tooling already ships
# (makefiles/e2e.mk pulls ghcr.io/helm/chartmuseum:v0.16.2), and "type: addon"
# components accept Helm registries as well as OCI ones.
# ALLOW_OVERWRITE lets "vela addon push -f" replace an existing version, which
# the same-tag republish scenario relies on. It is named
# addon-module-chartmuseum, not addon-chartmuseum: test/e2e-addon-component-test
# runs a ChartMuseum under that name on NodePort 30800, and a leftover copy of
# it would otherwise be reused here (AlreadyExists is ignored) on the wrong port.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-registry
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-registry
  template:
    metadata:
      labels:
        app: oci-registry
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: oci-registry
  namespace: default
spec:
  type: NodePort
  selector:
    app: oci-registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: addon-module-chartmuseum
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: addon-module-chartmuseum
  template:
    metadata:
      labels:
        app: addon-module-chartmuseum
    spec:
      containers:
        - name: chartmuseum
          image: ghcr.io/helm/chartmuseum:v0.16.2
          env:
            - name: STORAGE
              value: local
            - name: STORAGE_LOCAL_ROOTDIR
              value: /charts
            - name: ALLOW_OVERWRITE
              value: "true"
            - name: DISABLE_API
              value: "false"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: storage
              mountPath: /charts
      volumes:
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: addon-module-chartmuseum
  namespace: default
spec:
  type: NodePort
  selector:
    app: addon-module-chartmuseum
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30501
