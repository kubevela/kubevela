# Line-level auxiliary for v2: two documents in one file.
apiVersion: kit.example.com/v1alpha1
kind: WidgetClass
metadata:
  name: widget-kit-v2-premium
  labels:
    kit.example.com/tier: line
    kit.example.com/line: v2
spec:
  line: v2
  sizes: ["S", "M", "L"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: widget-kit-v2-line-config
  labels:
    kit.example.com/tier: line
    kit.example.com/line: v2
data:
  line: v2
  defaultClass: widget-kit-v2-premium
