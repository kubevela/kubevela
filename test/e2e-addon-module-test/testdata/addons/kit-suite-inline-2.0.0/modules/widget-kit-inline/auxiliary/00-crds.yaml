# Module-level auxiliary (tier 2): shared by every API line of the module.
# This plays the part a Crossplane XRD plays in a real module: the schema the
# line-level objects (WidgetClass, like a Composition) and the definitions'
# output (Widget) rely on. Plain CRDs, so no operator is needed.
#
# Two documents in one file: decodeYAMLDocuments splits on "---" and each
# document becomes its own object, in document order.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.kitinline.example.com
spec:
  group: kitinline.example.com
  scope: Namespaced
  names:
    kind: Widget
    listKind: WidgetList
    plural: widgets
    singular: widget
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Class
          type: string
          jsonPath: .spec.classRef
        - name: Line
          type: string
          jsonPath: .spec.apiLine
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgetclasses.kitinline.example.com
spec:
  group: kitinline.example.com
  scope: Cluster
  names:
    kind: WidgetClass
    listKind: WidgetClassList
    plural: widgetclasses
    singular: widgetclass
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
