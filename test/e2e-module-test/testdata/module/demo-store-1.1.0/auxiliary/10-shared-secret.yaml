# Second module-level auxiliary file. Present to show that the tier is
# assembled from every file in the directory, in sorted filename order, not
# from a single manifest.
apiVersion: v1
kind: Secret
metadata:
  name: demo-store-shared-token
type: Opaque
stringData:
  # Placeholder only. Never publish a real credential inside a module: the
  # artifact is world-readable to anyone who can pull from the registry.
  token: "REPLACE_ME"
