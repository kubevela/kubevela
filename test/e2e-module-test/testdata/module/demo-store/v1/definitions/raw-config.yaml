# A definition may also be a plain Kubernetes YAML object instead of a .cue
# file. The parser unmarshals .yaml/.yml straight through: no vela-definition
# wrapping, no "template" block, just the full definition object exactly as it
# would be applied by hand.
#
# Use this when a definition is generated by another tool, or when the CUE
# already lives inside an existing manifest. metadata.name here is the
# capability name and is rewritten the same way a .cue key is, so this
# installs as "demo-store-v1-raw-config".
#
# Note: unlike the .cue form, nothing validates this file beyond
# "metadata.name is not empty" until the cluster accepts it.
apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
  name: raw-config
  annotations:
    definition.oam.dev/description: "Definition shipped as raw YAML rather than CUE."
spec:
  workload:
    type: autodetects.core.oam.dev
  schematic:
    cue:
      template: |
        output: {
          apiVersion: "v1"
          kind:       "ConfigMap"
          metadata: name: context.name
          data: {
            value:      parameter.value
            renderedBy: "demo-store-v1-raw-config"
          }
        }
        parameter: {
          // Value written into the rendered ConfigMap.
          value: *"raw" | string
        }
