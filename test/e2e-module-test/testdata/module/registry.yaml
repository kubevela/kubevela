---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-registry
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-registry
  template:
    metadata:
      labels:
        app: oci-registry
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: oci-registry
  namespace: default
spec:
  type: NodePort
  selector:
    app: oci-registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
