# Inline-crate mirror of widget-platform-1.0.0 (scenario 02's addon): same
# resources/, template.cue, parameter.cue, and definitions/, but the crate
# (widget-kit-inline, an exact rename of widget-kit-1.0.0) is bundled under
# crates/widget-kit-inline/ instead of referenced via crates/_imports.cue.
# The crate is renamed (not just relocated) so this addon and widget-platform
# never contend for the same owned Application name or the same CRDs when
# both are installed in the same suite.
name: widget-platform-inline
version: 1.1.0
description: Test addon that bundles the widget-kit-inline crate inline (now at 1.1.0, which adds widget-kit-inline-v1-gauge), plus its own resources, outputs, parameters and one addon-level trait.
tags:
  - test
  - crate-inline
dependencies: []
