version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - durationcheck
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - gocyclo
    - gosmopolitan
    - loggercheck
    - makezero
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - protogetter
    - reassign
    - revive
    - spancheck
    - testifylint
    - unconvert
    - unparam
    - zerologlint
  disable:
    - contextcheck
    - errchkjson
    - rowserrcheck
    - sqlclosecheck
    # TODO(golangci-lint v2 upgrade): these newly-available/newly-stricter linters
    # surface a large amount of pre-existing debt across the repo. Disabled for now
    # to keep CI green after the v1.60.1 -> v2.12.2 upgrade; re-enable and fix the
    # findings in a follow-up cleanup PR
    - goconst
    - gosec
    - noctx
    - recvcheck
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: false
      check-blank: false
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      min-len: 3
      min-occurrences: 5
    gocritic:
      enabled-tags:
        - performance
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 32
    gocyclo:
      min-complexity: 35
    lll:
      tab-width: 1
    makezero:
      always: false
    nakedret:
      max-func-lines: 30
    revive:
      rules:
        - name: unused-parameter
          disabled: true
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        path: .*\.go
        text: fmt\.
      - linters:
          - errcheck
        path: .*\.go
        text: io/ioutil.*Read
      - linters:
          - dupl
          - errcheck
          - exportloopref
          - gocyclo
          - gosec
          - unparam
        path: _test(ing)?\.go
      - linters:
          - gocritic
        path: _test\.go
        text: (unnamedResult|exitAfterDefer)
      - linters:
          - gocritic
        path: pkg/definition/defkit/
        text: preferFprint
      - linters:
          - gosmopolitan
        path: i18n\.go
        text: Han
      - linters:
          - gocritic
        text: '(hugeParam|rangeValCopy):'
      - linters:
          - staticcheck
        text: 'SA3000:'
      # TODO(golangci-lint v2 upgrade): the bundled staticcheck version now reports
      # a large number of pre-existing quickfix/deprecation findings. Suppressed for
      # now to keep CI green after the v1.60.1 -> v2.12.2 upgrade; address these in
      # a follow-up cleanup PR.
      - linters:
          - staticcheck
        text: '^(QF[0-9]+|SA1019|ST1005):'
      - linters:
          - gocritic
        text: 'deprecatedComment'
      - linters:
          - errcheck
        path: pkg/builtin/kind/client.go
        text: 'os\.RemoveAll'
      - linters:
          - gosec
        text: 'G101:'
      - linters:
          - gosec
        text: 'G104:'
      - linters:
          - errcheck
        text: \.AddToUserAgent
      - linters:
          - revive
        text: don't use an underscore
      - linters:
          - revive
        text: 'package-comments: should have a package comment'
      - linters:
          - revive
        text: 'error-strings: error strings should not be capitalized or end with punctuation or a newline'
    paths:
      - zz_generated\..+\.go$
      - .*_test.go$
      - hack
      - e2e
      - third_party$
      - builtin$
      - examples$
      - scaffold
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/oam-dev/kubevela
  exclusions:
    generated: lax
    paths:
      - zz_generated\..+\.go$
      - .*_test.go$
      - hack
      - e2e
      - third_party$
      - builtin$
      - examples$
      - scaffold
