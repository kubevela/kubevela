calls: {}
output:
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    annotations: {}
    labels:
      app.oam.dev/appRevision: shop-v1
      app.oam.dev/component: web
      app.oam.dev/name: shop
      app.oam.dev/namespace: default
      app.oam.dev/resourceType: WORKLOAD
      workload.oam.dev/type: cuetest-workload
    name: web
    namespace: default
  spec:
    replicas: 3
    template:
      spec:
        containers:
        - image: shop:1.0
          name: web
outputs:
  hpa:
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      annotations: {}
      labels:
        app.oam.dev/appRevision: shop-v1
        app.oam.dev/component: web
        app.oam.dev/name: shop
        app.oam.dev/namespace: default
        app.oam.dev/resourceType: TRAIT
        trait.oam.dev/resource: hpa
        trait.oam.dev/type: hpa
      name: web
      namespace: default
    spec:
      maxReplicas: 10
      metrics:
      - resource:
          name: cpu
          target:
            averageUtilization: 50
            type: Utilization
        type: Resource
      minReplicas: 1
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: web
