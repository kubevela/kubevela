calls: {}
output:
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    annotations: {}
    labels:
      app.oam.dev/appRevision: shop-v1
      app.oam.dev/component: web
      app.oam.dev/name: shop
      app.oam.dev/namespace: default
      app.oam.dev/resourceType: WORKLOAD
      workload.oam.dev/type: cuetest-workload
    name: web
    namespace: default
  spec:
    template:
      spec:
        containers:
        - image: shop:1.0
          name: web
          volumeMounts:
          - mountPath: /srv/data
            name: workdir
        - image: envoy:1.30
          name: proxy
        initContainers:
        - args:
          - wget -O /work/index.html example.com
          command:
          - sh
          - -c
          env:
          - name: TOKEN
            valueFrom:
              secretKeyRef:
                key: token
                name: creds
          image: busybox:1.36
          imagePullPolicy: Always
          name: fetch
          volumeMounts:
          - mountPath: /work
            name: workdir
        volumes:
        - emptyDir: {}
          name: workdir
outputs: {}
