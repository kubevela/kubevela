calls:
  vela/helm:
    '#Render':
    - $params:
        chart:
          repoURL: https://charts.example.com
          source: redis
          version: 18.1.0
        context:
          appName: shop
          appNamespace: team-a
          cluster: local
          name: redis
          namespace: team-a
        options:
          atomic: true
          cache:
            key: shop-redis
          cleanupOnFail: true
          createNamespace: false
          force: true
          includeCRDs: false
          maxHistory: 3
          recreatePods: true
          skipHooks: true
          skipTests: false
          timeout: 10m
          wait: true
        release:
          name: redis
          namespace: team-a
      $returns:
        resources:
        - apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: redis
        - apiVersion: v1
          kind: Service
          metadata:
            name: redis
output:
  apiVersion: v1
  data:
    chartSource: redis
    chartVersion: 18.1.0
    releaseName: redis
    releaseNamespace: team-a
    repoURL: https://charts.example.com
    resourceCount: "2"
  kind: ConfigMap
  metadata:
    annotations:
      helm.oam.dev/chart: redis
    labels:
      app.oam.dev/appRevision: shop-v1
      app.oam.dev/component: redis
      app.oam.dev/name: shop
      app.oam.dev/namespace: team-a
      app.oam.dev/resourceType: WORKLOAD
      helm.oam.dev/chart: redis
      workload.oam.dev/type: helmchart
    name: redis-helm-release
    namespace: team-a
outputs:
  helm-resource-0:
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      annotations: {}
      labels:
        app.oam.dev/appRevision: shop-v1
        app.oam.dev/component: redis
        app.oam.dev/name: shop
        app.oam.dev/namespace: team-a
        app.oam.dev/resourceType: TRAIT
        trait.oam.dev/resource: helm-resource-0
        trait.oam.dev/type: AuxiliaryWorkload
      name: redis
      namespace: team-a
  helm-resource-1:
    apiVersion: v1
    kind: Service
    metadata:
      annotations: {}
      labels:
        app.oam.dev/appRevision: shop-v1
        app.oam.dev/component: redis
        app.oam.dev/name: shop
        app.oam.dev/namespace: team-a
        app.oam.dev/resourceType: TRAIT
        trait.oam.dev/resource: helm-resource-1
        trait.oam.dev/type: AuxiliaryWorkload
      name: redis
      namespace: team-a
traits: {}
