calls:
  vela/helm:
    '#Render':
    - $params:
        chart:
          repoURL: https://charts.example.com
          source: redis
          version: 18.1.0
        context:
          appName: shop
          appNamespace: team-a
          cluster: local
          name: redis
          namespace: team-a
        options:
          cache:
            key: shop-redis
        release:
          name: redis
          namespace: team-a
      $returns:
        resources: []
output:
  apiVersion: v1
  data:
    chartSource: redis
    chartVersion: 18.1.0
    releaseName: redis
    releaseNamespace: team-a
    repoURL: https://charts.example.com
    resourceCount: "0"
  kind: ConfigMap
  metadata:
    annotations:
      helm.oam.dev/chart: redis
    labels:
      app.oam.dev/appRevision: shop-v1
      app.oam.dev/component: redis
      app.oam.dev/name: shop
      app.oam.dev/namespace: team-a
      app.oam.dev/resourceType: WORKLOAD
      helm.oam.dev/chart: redis
      workload.oam.dev/type: helmchart
    name: redis-helm-release
    namespace: team-a
outputs: {}
traits: {}
