calls: {}
output:
  apiVersion: apps/v1
  kind: StatefulSet
  metadata:
    annotations: {}
    labels:
      app.oam.dev/appRevision: shop-v1
      app.oam.dev/component: db
      app.oam.dev/name: shop
      app.oam.dev/namespace: default
      app.oam.dev/resourceType: WORKLOAD
      workload.oam.dev/type: statefulset
    name: db
    namespace: default
  spec:
    selector:
      matchLabels:
        app.oam.dev/component: db
    template:
      metadata:
        labels:
          app.oam.dev/component: db
          app.oam.dev/name: shop
      spec:
        containers:
        - image: postgres:16
          name: db
          volumeMounts:
          - mountPath: /data
            name: data
            subPath: pg
          - mountPath: /etc/postgresql
            name: conf
          - mountPath: /etc/creds
            name: creds
          - mountPath: /dev/shm
            name: shm
          - mountPath: /tmp/shm
            name: shm
            subPath: tmp
          - mountPath: /logs
            name: logs
        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
        - configMap:
            defaultMode: 420
            items:
            - key: pg.conf
              mode: 511
              path: postgresql.conf
            name: db-conf
          name: conf
        - name: creds
          secret:
            defaultMode: 256
            secretName: db-creds
        - emptyDir:
            medium: Memory
          name: shm
        - hostPath:
            path: /var/log/db
          name: logs
outputs: {}
traits: {}
