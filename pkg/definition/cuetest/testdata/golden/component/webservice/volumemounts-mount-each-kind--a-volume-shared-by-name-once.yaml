calls: {}
output:
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    annotations: {}
    labels:
      app.oam.dev/appRevision: shop-v1
      app.oam.dev/component: web
      app.oam.dev/name: shop
      app.oam.dev/namespace: default
      app.oam.dev/resourceType: WORKLOAD
      workload.oam.dev/type: webservice
    name: web
    namespace: default
  spec:
    selector:
      matchLabels:
        app.oam.dev/component: web
    template:
      metadata:
        labels:
          app.oam.dev/component: web
          app.oam.dev/name: shop
      spec:
        containers:
        - image: shop:1.0
          name: web
          volumeMounts:
          - mountPath: /data
            name: data
          - mountPath: /etc/shop
            name: conf
          - mountPath: /etc/creds
            name: creds
          - mountPath: /cache
            name: cache
          - mountPath: /tmp/cache
            name: cache
            subPath: tmp
          - mountPath: /logs
            name: logs
        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shop-data
        - configMap:
            defaultMode: 420
            name: shop-conf
          name: conf
        - name: creds
          secret:
            defaultMode: 420
            secretName: shop-creds
        - emptyDir:
            medium: ""
          name: cache
        - hostPath:
            path: /var/log/shop
          name: logs
