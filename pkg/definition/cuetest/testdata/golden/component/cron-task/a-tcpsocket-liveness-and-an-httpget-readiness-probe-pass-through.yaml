calls: {}
output:
  apiVersion: batch/v1
  kind: CronJob
  metadata:
    annotations: {}
    labels:
      app.oam.dev/appRevision: shop-v1
      app.oam.dev/component: report
      app.oam.dev/name: shop
      app.oam.dev/namespace: default
      app.oam.dev/resourceType: WORKLOAD
      workload.oam.dev/type: cron-task
    name: report
    namespace: default
  spec:
    concurrencyPolicy: Allow
    failedJobsHistoryLimit: 1
    jobTemplate:
      metadata:
        labels:
          app.oam.dev/component: report
          app.oam.dev/name: shop
      spec:
        backoffLimit: 6
        completions: 1
        parallelism: 1
        template:
          metadata:
            labels:
              app.oam.dev/component: report
              app.oam.dev/name: shop
          spec:
            containers:
            - image: shop-report:1.0
              livenessProbe:
                failureThreshold: 3
                initialDelaySeconds: 0
                periodSeconds: 10
                successThreshold: 1
                tcpSocket:
                  port: 8080
                timeoutSeconds: 1
              name: report
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /ready
                  port: 8080
                initialDelaySeconds: 0
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 1
            restartPolicy: Never
    schedule: 0 2 * * *
    successfulJobsHistoryLimit: 3
    suspend: false
outputs: {}
traits: {}
