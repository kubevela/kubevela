calls: {}
output:
  apiVersion: batch/v1
  kind: CronJob
  metadata:
    annotations: {}
    labels:
      app.oam.dev/appRevision: shop-v1
      app.oam.dev/component: report
      app.oam.dev/name: shop
      app.oam.dev/namespace: default
      app.oam.dev/resourceType: WORKLOAD
      workload.oam.dev/type: cron-task
    name: report
    namespace: default
  spec:
    concurrencyPolicy: Allow
    failedJobsHistoryLimit: 1
    jobTemplate:
      metadata:
        labels:
          app.oam.dev/component: report
          app.oam.dev/name: shop
      spec:
        backoffLimit: 6
        completions: 1
        parallelism: 1
        template:
          metadata:
            labels:
              app.oam.dev/component: report
              app.oam.dev/name: shop
          spec:
            containers:
            - command:
              - /report
              - --daily
              env:
              - name: TZ
                value: Europe/Dublin
              image: shop-report:1.0
              imagePullPolicy: Always
              name: report
            hostAliases:
            - hostnames:
              - smtp.local
              ip: 10.0.0.1
            imagePullSecrets:
            - name: registry
            restartPolicy: Never
    schedule: 0 2 * * *
    successfulJobsHistoryLimit: 3
    suspend: false
outputs: {}
traits: {}
