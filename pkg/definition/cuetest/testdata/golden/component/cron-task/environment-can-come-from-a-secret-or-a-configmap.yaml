calls: {}
output:
  apiVersion: batch/v1
  kind: CronJob
  metadata:
    annotations: {}
    labels:
      app.oam.dev/appRevision: shop-v1
      app.oam.dev/component: report
      app.oam.dev/name: shop
      app.oam.dev/namespace: default
      app.oam.dev/resourceType: WORKLOAD
      workload.oam.dev/type: cron-task
    name: report
    namespace: default
  spec:
    concurrencyPolicy: Allow
    failedJobsHistoryLimit: 1
    jobTemplate:
      metadata:
        labels:
          app.oam.dev/component: report
          app.oam.dev/name: shop
      spec:
        backoffLimit: 6
        completions: 1
        parallelism: 1
        template:
          metadata:
            labels:
              app.oam.dev/component: report
              app.oam.dev/name: shop
          spec:
            containers:
            - env:
              - name: PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: shop-db
              - name: MODE
                valueFrom:
                  configMapKeyRef:
                    key: mode
                    name: shop-conf
              image: shop-report:1.0
              name: report
            restartPolicy: Never
    schedule: 0 2 * * *
    successfulJobsHistoryLimit: 3
    suspend: false
outputs: {}
traits: {}
