calls: {}
output:
  apiVersion: batch/v1
  kind: CronJob
  metadata:
    annotations: {}
    labels:
      app.oam.dev/appRevision: shop-v1
      app.oam.dev/component: report
      app.oam.dev/name: shop
      app.oam.dev/namespace: default
      app.oam.dev/resourceType: WORKLOAD
      workload.oam.dev/type: cron-task
    name: report
    namespace: default
  spec:
    concurrencyPolicy: Allow
    failedJobsHistoryLimit: 1
    jobTemplate:
      metadata:
        labels:
          app.oam.dev/component: report
          app.oam.dev/name: shop
      spec:
        activeDeadlineSeconds: 600
        backoffLimit: 1
        completions: 2
        parallelism: 2
        template:
          metadata:
            labels:
              app.oam.dev/component: report
              app.oam.dev/name: shop
          spec:
            containers:
            - image: shop-report:1.0
              name: report
            restartPolicy: OnFailure
        ttlSecondsAfterFinished: 3600
    schedule: 0 2 * * *
    successfulJobsHistoryLimit: 3
    suspend: false
outputs: {}
traits: {}
