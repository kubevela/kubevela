calls: {}
output:
  apiVersion: batch/v1
  kind: CronJob
  metadata:
    annotations: {}
    labels:
      app.oam.dev/appRevision: shop-v1
      app.oam.dev/component: report
      app.oam.dev/name: shop
      app.oam.dev/namespace: default
      app.oam.dev/resourceType: WORKLOAD
      workload.oam.dev/type: cron-task
    name: report
    namespace: default
  spec:
    concurrencyPolicy: Allow
    failedJobsHistoryLimit: 1
    jobTemplate:
      metadata:
        labels:
          app.oam.dev/component: report
          app.oam.dev/name: shop
      spec:
        backoffLimit: 6
        completions: 1
        parallelism: 1
        template:
          metadata:
            labels:
              app.oam.dev/component: report
              app.oam.dev/name: shop
          spec:
            containers:
            - image: shop-report:1.0
              name: report
              volumeMounts:
              - mountPath: /data
                name: data
                subPath: reports
              - mountPath: /etc/report
                name: conf
              - mountPath: /etc/creds
                name: creds
              - mountPath: /tmp
                name: tmp
              - mountPath: /var/tmp
                name: tmp
                subPath: var
              - mountPath: /logs
                name: logs
            restartPolicy: Never
            volumes:
            - name: data
              persistentVolumeClaim:
                claimName: shop-data
            - configMap:
                defaultMode: 420
                name: report-conf
              name: conf
            - name: creds
              secret:
                defaultMode: 420
                secretName: report-creds
            - emptyDir:
                medium: ""
              name: tmp
            - hostPath:
                path: /var/log/report
              name: logs
    schedule: 0 2 * * *
    successfulJobsHistoryLimit: 3
    suspend: false
outputs: {}
traits: {}
