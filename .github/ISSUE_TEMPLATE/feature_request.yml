name: "🚀 Feature request"
description: Suggest a new feature or an improvement to an existing one
title: ""
labels: ["type/feature"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of request is this?
      options:
        - New feature
        - Enhancement to an existing feature
    validations:
      required: true
  - type: input
    id: affected
    attributes:
      label: Affected feature or component
      description: For an enhancement, name what you want improved. Leave blank for a brand new feature.
      placeholder: e.g. Application rollout, vela CLI output, CUE template rendering
  - type: textarea
    id: problem
    attributes:
      label: What problem or limitation does this address?
      description: "A clear and concise description of the problem. Ex. I'm always frustrated when [...] / The current limitation with [existing feature] is [...]"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: A clear and concise description of any alternative solutions or features you've considered.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context or screenshots here.
