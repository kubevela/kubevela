name: 'Start Nacos'
description: 'Starts a standalone Nacos server on the kind network and tells the e2e suites where it is'

runs:
  using: 'composite'
  steps:
    # Pods reach the container by name: kind's CoreDNS forwards to the node's resolver, which is
    # Docker's DNS on the kind network. The suite itself reads Nacos from the runner.
    - name: Start Nacos
      shell: bash
      run: |
        docker run -d --name nacos --network kind \
          -e MODE=standalone -e NACOS_AUTH_ENABLE=false -e JVM_XMS=256m -e JVM_XMX=512m \
          -p 8848:8848 -p 9848:9848 nacos/nacos-server:v2.4.3
        for _ in $(seq 80); do
          curl -sf --max-time 3 http://localhost:8848/nacos/v1/console/health/readiness && break
          sleep 3
        done
        curl -sf --max-time 3 http://localhost:8848/nacos/v1/console/health/readiness \
          || { docker logs --tail 50 nacos; exit 1; }
        echo "NACOS_ADDR=localhost:8848" >> "$GITHUB_ENV"
        echo "NACOS_POD_HOST=nacos" >> "$GITHUB_ENV"
