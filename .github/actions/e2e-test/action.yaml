name: 'Kubevela K8s Upgrade e2e Test'
description: 'Runs Kubevela K8s upgrade e2e tests, uploads coverage, and collects diagnostics on failure.'

inputs:
  codecov-token:
    description: 'Codecov token for uploading coverage reports'
    required: false
    default: ''
  codecov-enable:
    description: 'Enable codecov coverage upload'
    required: false
    default: 'false'
  addon-procs:
    description: 'Ginkgo worker processes for the addon E2E suite (1 to 4)'
    required: false
    default: '2'
  suite:
    description: 'Suite to run: all, api, addon, core, module, or addon-module'
    required: false
    default: 'all'
  procs:
    description: 'Ginkgo workers for a selected live-cluster suite (1 to 4)'
    required: false
    default: '2'

runs:
  using: "composite"
  steps:
    - name: Validate suite selection
      shell: bash
      env:
        E2E_SUITE: ${{ inputs.suite }}
        E2E_WORKERS: ${{ inputs.procs }}
      run: |
        case "$E2E_SUITE" in
          all|api|addon|core|module|addon-module) ;;
          *) echo "Unknown E2E suite: $E2E_SUITE" >&2; exit 1 ;;
        esac
        case "$E2E_WORKERS" in
          1|2|3|4) ;;
          *) echo "procs must be between 1 and 4" >&2; exit 1 ;;
        esac

    # ========================================================================
    # Environment Setup
    # ========================================================================
    - name: Configure environment setup
      uses: ./.github/actions/env-setup
      with:
        install-ginkgo: 'true'
        install-setup-envtest: ${{ inputs.suite == 'addon-module' && 'true' || 'false' }}
        install-kustomize: 'false'

    - name: Build project
      if: ${{ inputs.suite != 'addon-module' }}
      shell: bash
      env:
        E2E_SUITE: ${{ inputs.suite }}
      run: |
        case "$E2E_SUITE" in
          all|api) make ;;
          core|module|addon) make e2e-vela-cli ;;
        esac

    # ========================================================================
    # E2E Test Environment Preparation
    # ========================================================================
    - name: Prepare e2e environment
      id: prepare
      if: ${{ inputs.suite != 'addon-module' }}
      shell: bash
      run: |
        echo "Preparing e2e test environment..."
        make e2e-cleanup
        if [ "$E2E_SUITE" = module ]; then
          make e2e-setup-core-module
        else
          make e2e-setup-core
        fi

        echo "Running Helm tests..."
        helm test -n vela-system kubevela --timeout 5m

    # ========================================================================
    # E2E Test Execution
    # ========================================================================
    - name: Run API e2e tests
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && (inputs.suite == 'all' || inputs.suite == 'api') }}
      shell: bash
      run: |
        echo "Running API e2e tests..."
        make e2e-api-test

    - name: Run addon e2e tests
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && (inputs.suite == 'all' || inputs.suite == 'addon') }}
      shell: bash
      env:
        E2E_ADDON_PROCS: ${{ inputs.addon-procs }}
      run: |
        echo "Running addon e2e tests..."
        case "$E2E_ADDON_PROCS" in
          1|2|3|4) ;;
          *) echo "addon-procs must be between 1 and 4" >&2; exit 1 ;;
        esac
        make e2e-addon-test E2E_PROCS="$E2E_ADDON_PROCS"

    - name: Run general e2e tests
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && (inputs.suite == 'all' || inputs.suite == 'core') }}
      shell: bash
      env:
        E2E_WORKERS: ${{ inputs.procs }}
        E2E_SUITE: ${{ inputs.suite }}
      run: |
        echo "Running general e2e tests..."
        if [ "$E2E_SUITE" = all ]; then E2E_WORKERS=1; fi
        make e2e-test E2E_PROCS="$E2E_WORKERS"

    - name: Run module e2e tests
      # Its own step, own package, and always() so a failure in an earlier
      # step (e.g. an unrelated e2e-api-test flake) cannot prevent this from
      # running.
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && (inputs.suite == 'all' || inputs.suite == 'module') }}
      shell: bash
      env:
        E2E_WORKERS: ${{ inputs.procs }}
        E2E_SUITE: ${{ inputs.suite }}
      run: |
        echo "Running module e2e tests..."
        if [ "$E2E_SUITE" = all ]; then E2E_WORKERS=1; fi
        make e2e-module-test E2E_PROCS="$E2E_WORKERS"

    - name: Run addon/module envtest suite
      if: ${{ inputs.suite == 'addon-module' }}
      shell: bash
      run: make e2e-addon-module-test

    - name: Run addon-component e2e tests
      # Same reasoning as the module step above. The suite brings up its own
      # in-cluster ChartMuseum and pushes its fixtures into it, so it needs no
      # external registry; e2e-setup-core has already installed the chart with
      # featureGates.enableAddonComponent=true.
      if: always()
      shell: bash
      run: |
        echo "Running addon-component e2e tests..."
        make e2e-addon-component-test

    - name: Run addon-module e2e tests
      # This test installs addons that import modules. It makes sure that
      # KubeVela installs, upgrades and removes these addons and modules correctly.
      if: always()
      shell: bash
      run: |
        echo "Running addon-module e2e tests..."
        make e2e-addon-module-test

    - name: Upload coverage report
      if: ${{ inputs.codecov-enable == 'true' }}
      uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24
      with:
        token: ${{ inputs.codecov-token }}
        files: ./coverage.txt
        flags: core-unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    # ========================================================================
    # Failure Diagnostics
    # ========================================================================
    - name: Collect failure diagnostics
      if: ${{ failure() && inputs.suite != 'addon-module' }}
      shell: bash
      run: |
        echo "=== FAILURE DIAGNOSTICS ==="
        echo "Collecting diagnostic information for debugging..."

        echo "--- Cluster Status ---"
        kubectl get nodes -o wide || true
        kubectl get pods -A || true

        echo "--- KubeVela System Logs ---"
        kubectl logs -n vela-system -l app.kubernetes.io/name=vela-core --tail=100 || true

        echo "--- Recent Events ---"
        kubectl get events -A --sort-by='.lastTimestamp' --field-selector type!=Normal || true

        echo "--- Helm Release Status ---"
        helm list -A || true
        helm status kubevela -n vela-system || true

        echo "--- Test Artifacts ---"
        find . -name "*.log" -type f -exec echo "=== {} ===" \; -exec cat {} \; || true
