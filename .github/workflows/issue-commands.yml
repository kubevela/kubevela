name: Run commands for issues and pull requests
on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  bot:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: "kubevela/kubevela-github-actions"
          path: ./actions
          ref: v0.4.2
      # GH_KUBEVELA_COMMAND_WORKFLOW has been invalid since ~2026-04-24 (401 Bad
      # credentials on GET /user). Prefer a still-valid override secret when present,
      # otherwise use the workflow GITHUB_TOKEN which already has issues/PR write.
      - name: Resolve bot token
        id: token
        env:
          OVERRIDE_TOKEN: ${{ secrets.GH_KUBEVELA_COMMAND_WORKFLOW }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token="${OVERRIDE_TOKEN:-}"
          if [ -n "${token}" ]; then
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user || true)
            if [ "${code}" != "200" ]; then
              echo "Override token rejected (HTTP ${code}); falling back to github.token" >&2
              token="${FALLBACK_TOKEN}"
            fi
          else
            echo "Override token unset; using github.token" >&2
            token="${FALLBACK_TOKEN}"
          fi
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"
      # Action constructor always calls users.getAuthenticated(); GITHUB_TOKEN is not a
      # user PAT so that call 401/403s. Patch to a static actor name for error reporting.
      - name: Patch commands action for github.token
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path("actions/common/Action.js")
          text = path.read_text()
          pattern = re.compile(
              r"this\.username\s*=\s*new github_1\.GitHub\(this\.token\)\.users\.getAuthenticated\(\)\.then\(\(v\)\s*=>\s*v\.data\.name\);"
          )
          new = "this.username = Promise.resolve(process.env.GITHUB_ACTOR || 'github-actions[bot]');"
          updated, n = pattern.subn(new, text, count=1)
          if n != 1:
              raise SystemExit(f"expected getAuthenticated() assignment not found in {path}")
          path.write_text(updated)
          print(f"patched {path}")
          PY
      # Node 14 matches the vintage package-lock in kubevela-github-actions@v0.4.2.
      # Newer npm (Node 20+) rejects npm ci because that lockfile is out of sync.
      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: "14"
      - name: Install Dependencies
        run: npm ci --production --prefix ./actions
      - name: Run Commands
        uses: ./actions/commands
        with:
          token: ${{ steps.token.outputs.token }}
          configPath: issue-commands

  assign-policy:
    runs-on: ubuntu-22.04
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '/assign') || contains(github.event.comment.body, '\assign'))
    permissions:
      contents: read
      issues: write
    steps:
      # /assign is handled here, not in issue-commands.json: the commands action
      # also allows anyone whose login is a substring of .github/comment.userlist.
      - name: Handle /assign (maintainers and triagers assign, others get the assignment rule)
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Same command pattern the commands action matched.
            const body = context.payload.comment.body || ""
            if (!/(\/|\\)assign(\s|$)/i.test(body)) return

            const user = context.payload.comment.user.login
            const { owner, repo } = context.repo
            const issue_number = context.issue.number

            // Maintainers (write/admin) and triagers listed in .github/comment.userlist can assign.
            let allowed = false
            try {
              const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: user })
              allowed = perm.permission === "admin" || perm.permission === "write"
            } catch (err) {
              console.log("could not read collaborator permission for " + user + ": " + err.message)
            }
            if (!allowed) {
              try {
                const { data: file } = await github.rest.repos.getContent({ owner, repo, path: ".github/comment.userlist" })
                const triagers = Buffer.from(file.content, "base64").toString("utf-8")
                  .split(/\r?\n/).map((l) => l.trim().toLowerCase()).filter(Boolean)
                allowed = triagers.includes(user.toLowerCase())
              } catch (err) {
                console.log("could not read .github/comment.userlist: " + err.message)
              }
            }

            if (allowed) {
              // "/assign" assigns the commenter; "/assign @a b -c" adds a and b, removes c.
              const args = ((body.match(/(?:\\|\/)assign(.*)(?:\r)?(?:\n|$)/i) || [])[1] || "")
                .trim().split(/\s+/).filter(Boolean)
              const add = [], remove = []
              for (const arg of args) {
                const login = arg.replace(/^-/, "").replace(/^@/, "")
                if (login) (arg.startsWith("-") ? remove : add).push(login)
              }
              if (args.length === 0) add.push(user)
              if (add.length) await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: add })
              if (remove.length) await github.rest.issues.removeAssignees({ owner, repo, issue_number, assignees: remove })
              console.log(user + " assigned [" + add.join(", ") + "] unassigned [" + remove.join(", ") + "] on #" + issue_number)
              return
            }

            // Reply once per user per issue. Only trust the marker in this workflow's own comments.
            const marker = `<!-- assign-policy:${user} -->`
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            if (comments.some((c) => c.user && c.user.login === "github-actions[bot]" && (c.body || "").includes(marker))) {
              console.log("already replied to " + user + " on #" + issue_number)
              return
            }

            const assignees = (context.payload.issue.assignees || []).map((a) => "@" + a.login)
            const taken = assignees.length
              ? `\n> [!NOTE]\n> This issue is already assigned to ${assignees.join(", ")}. Please pick another issue, or talk with the assignee here before you do any work.\n`
              : ""

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `${marker}
            Hi @${user}, thanks for offering to work on this! :wave:

            The \`/assign\` command no longer assigns issues to contributors. In KubeVela, **a maintainer must assign an issue to you before you open a pull request.** This prevents duplicate work, and it makes sure that maintainers agree with the approach before you start.
            ${taken}
            **What to do next**
            1. Your request here is noted. If you have not done so already, add a short comment that explains how you plan to fix this.
            2. **Wait until a maintainer assigns this issue to you.** Do not start the work or open a pull request before that.
            3. Do the work and open your pull request. Link this issue in the description with \`Fixes #${issue_number}\`, or with \`Related to #${issue_number}\` if the pull request completes only part of it.

            > [!IMPORTANT]
            > Maintainers will not review a pull request that does not have an assigned issue, and they can close it.

            More information:
            - [CONTRIBUTING.md](https://github.com/kubevela/kubevela/blob/master/CONTRIBUTING.md)
            - [Code contribution guide](https://kubevela.io/docs/contributor/code-contribute)
            - [Announcement in the CNCF Slack](https://cloud-native.slack.com/archives/C01BLQ3HTJA/p1793980491783859) (join at https://slack.cncf.io)
            `,
            })

            await github.rest.reactions.createForIssueComment({
              owner,
              repo,
              comment_id: context.payload.comment.id,
              content: "eyes",
            })

  backport:
    runs-on: ubuntu-22.04
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/backport')
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Extract Command
        id: command
        uses: xt0rted/slash-command-action@bf51f8f5f4ea3d58abc7eca58f77104182b23e88
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          command: backport
          reaction: "true"
          reaction-type: "eyes"
          allow-edits: "false"
          permission-level: read
      - name: Handle Command
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          VERSION: ${{ steps.command.outputs.command-arguments }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.VERSION
            let label = "backport release-" + version
            if (version.includes("release")) {
              label = "backport " + version
            }
            // Add our backport label.
            github.rest.issues.addLabels({
              // Every pull request is an issue, but not every issue is a pull request.
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: [label]
            })
            console.log("Added '" + label + "' label.")
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Open Backport PR
        uses: zeebe-io/backport-action@0193454f0c5947491d348f33a275c119f30eb736
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_workspace: ${{ github.workspace }}

  retest:
    runs-on: ubuntu-22.04
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/retest')
    permissions:
      actions: write
      pull-requests: write
      issues: write
    steps:
      - name: Retest the current pull request
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          PULL_REQUEST_ID: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pull_request_id = process.env.PULL_REQUEST_ID
            const comment_id = process.env.COMMENT_ID
            const comment_body = process.env.COMMENT_BODY
            console.log("retest pr: #" + pull_request_id + " comment: " + comment_body)
            const {data: pr} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull_request_id,
            })
            console.log("pr: " + JSON.stringify(pr))
            const action = comment_body.split(" ")[0]
            let workflow_ids = comment_body.split(" ").slice(1).filter(line => line.length > 0).map(line => line + ".yml")
            if (workflow_ids.length == 0) workflow_ids = ["go.yml", "unit-test.yml", "e2e-test.yml", "e2e-multicluster-test.yml"]
            for (let i = 0; i < workflow_ids.length; i++) {
              const workflow_id = workflow_ids[i]
              const {data: runs} = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow_id,
                head_sha: pr.head.sha,
              })
              console.log("runs for " + workflow_id + ": ", JSON.stringify(runs))
              // Only consider the newest completed run per workflow. Skip queued/
              // in_progress/requested/waiting/pending so we do not call re-run APIs
              // on unfinished runs (4xx, now swallowed) and still fall back to an
              // older completed failed run. Soft-fail "cannot be retried" so a
              // stale/success run does not fail the whole issue-commands workflow.
              const candidates = runs.workflow_runs
                .filter((workflow_run) => workflow_run.status === "completed")
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))
              const workflow_run = candidates[0]
              if (!workflow_run) {
                console.log("no retriable runs for " + workflow_id)
                continue
              }
              let handler = github.rest.actions.reRunWorkflow
              if (action === "/retest-failed") handler = github.rest.actions.reRunWorkflowFailedJobs
              try {
                await handler({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: workflow_run.id
                })
                console.log("re-ran " + workflow_id + " run " + workflow_run.id)
              } catch (err) {
                console.log("skip re-run of " + workflow_id + " run " + workflow_run.id + ": " + err.message)
              }
            }
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment_id,
              content: "eyes",
            });
