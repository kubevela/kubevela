name: E2E Test

on:
  push:
    branches:
      - master
      - release-*
    tags:
      - v*
  workflow_dispatch: {}
  pull_request:
    branches:
      - master
      - release-*

permissions:
  contents: read

env:
  # Common versions
  GO_VERSION: '1.23.8'

jobs:

  detect-noop:
    permissions:
      actions: write
    runs-on: ubuntu-22.04
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.mdx", "**.png", "**.jpg"]'
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'
        continue-on-error: true

  e2e-tests:
    name: ${{ matrix.suite }} / Kubernetes ${{ matrix.k8s-version }}
    runs-on: ubuntu-22.04
    needs: [ detect-noop ]
    if: needs.detect-noop.outputs.noop != 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            k8s-version: v1.31.9
            procs: '3'
          - suite: module
            k8s-version: v1.31.9
            procs: '3'
          - suite: addon
            k8s-version: v1.31.9
            procs: '2'
          - suite: addon-module
            k8s-version: v1.31.9
            procs: '1'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.k8s-version }}-${{ matrix.suite }}
      cancel-in-progress: true

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup KinD
        if: ${{ matrix.suite != 'addon-module' }}
        uses: ./.github/actions/setup-kind-cluster
        with:
          k8s-version: ${{ matrix.k8s-version }}

      # ========================================================================
      # E2E Test Execution
      # ========================================================================
      - name: Run E2E suite
        uses: ./.github/actions/e2e-test
        with:
          suite: ${{ matrix.suite }}
          procs: ${{ matrix.procs }}
          addon-procs: ${{ matrix.procs }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload suite reports
        if: ${{ always() }}
        uses: actions/upload-artifact@134dcf33c0b9454c4b17a936843d7e21dccdc335 # v4.3.6
        with:
          name: e2e-${{ matrix.suite }}-${{ matrix.k8s-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: _artifacts/e2e/
          if-no-files-found: warn

      - name: Cleanup image
        if: ${{ always() && matrix.suite != 'addon-module' }}
        run: |
          make image-cleanup
          docker image prune -f --filter "until=24h"

  e2e-api:
    name: Existing API E2E coverage
    runs-on: ubuntu-22.04
    needs: [ detect-noop ]
    if: ${{ !cancelled() && needs.detect-noop.outputs.noop != 'true' }}
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-v1.31.9-api
      cancel-in-progress: true
    steps:
      - name: Check out code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup KinD
        uses: ./.github/actions/setup-kind-cluster
        with:
          k8s-version: v1.31.9
      - name: Run existing API E2E tests
        uses: ./.github/actions/e2e-test
        with:
          suite: api
          procs: '1'
          codecov-enable: true
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
      - name: Cleanup image
        if: ${{ always() }}
        run: |
          make image-cleanup
          docker image prune -f --filter "until=24h"
