name: E2E Test

on:
  push:
    branches:
      - master
      - release-*
    tags:
      - v*
  workflow_dispatch: {}
  pull_request:
    branches:
      - master
      - release-*

permissions:
  contents: read

env:
  # Common versions
  GO_VERSION: '1.27.1'
  # Every suite job loads the same image, built once by build-image. Suite jobs
  # do not wait for that job: they set up their cluster and build bin/vela
  # meanwhile, and wait for the artifact just before installing the chart.
  E2E_IMAGE_ARTIFACT: vela-core-e2e-image-${{ github.run_id }}
  E2E_IMAGE_JOB: Build vela-core e2e image

jobs:

  detect-noop:
    permissions:
      actions: write
    runs-on: ubuntu-22.04
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.mdx", "**.png", "**.jpg"]'
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'
        continue-on-error: true

  build-image:
    name: Build vela-core e2e image
    runs-on: ubuntu-22.04
    needs: [ detect-noop ]
    if: needs.detect-noop.outputs.noop != 'true'
    timeout-minutes: 30
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Build and save image
        run: make image-archive E2E_IMAGE_ARCHIVE=_artifacts/image/vela-core-test.tar

      - name: Upload image
        uses: actions/upload-artifact@134dcf33c0b9454c4b17a936843d7e21dccdc335 # v4.3.6
        with:
          name: ${{ env.E2E_IMAGE_ARTIFACT }}
          path: _artifacts/image/vela-core-test.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  e2e-tests:
    name: ${{ matrix.package }}
    runs-on: ubuntu-22.04
    needs: [ detect-noop ]
    if: needs.detect-noop.outputs.noop != 'true'
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core-application
            package: e2e-application-test
            k8s-version: v1.37.0
          - suite: core-definitions
            package: e2e-definition-test
            k8s-version: v1.37.0
          - suite: core-config
            package: e2e-config-test
            k8s-version: v1.37.0
          - suite: core-helm
            package: e2e-helm-test
            k8s-version: v1.37.0
          - suite: module
            package: e2e-module-test
            k8s-version: v1.37.0
          - suite: source
            package: e2e-source-test
            k8s-version: v1.37.0
          - suite: addon
            package: e2e-addon-test
            k8s-version: v1.37.0
          - suite: addon-module
            package: e2e-addon-module-test
            k8s-version: v1.37.0
          - suite: addon-component
            package: e2e-addon-component-test
            k8s-version: v1.37.0
          - suite: api-application
            package: e2e-cli-application-test
            k8s-version: v1.37.0
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.k8s-version }}-${{ matrix.suite }}
      cancel-in-progress: true

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup KinD
        uses: ./.github/actions/setup-kind-cluster
        with:
          k8s-version: ${{ matrix.k8s-version }}
          load-image: 'false'

      - name: Start Nacos
        if: matrix.suite == 'core-config'
        uses: ./.github/actions/start-nacos

      # ========================================================================
      # E2E Test Execution
      # ========================================================================
      - name: Run E2E suite
        uses: ./.github/actions/e2e-test
        with:
          suite: ${{ matrix.suite }}
          image-artifact: ${{ env.E2E_IMAGE_ARTIFACT }}
          image-job: ${{ env.E2E_IMAGE_JOB }}

      - name: Upload suite reports
        if: ${{ always() }}
        uses: actions/upload-artifact@134dcf33c0b9454c4b17a936843d7e21dccdc335 # v4.3.6
        with:
          name: e2e-${{ matrix.suite }}-${{ matrix.k8s-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: _artifacts/e2e/
          if-no-files-found: warn

  e2e-api:
    name: e2e/ API tests
    runs-on: ubuntu-22.04
    needs: [ detect-noop ]
    if: ${{ !cancelled() && needs.detect-noop.outputs.noop != 'true' }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-v1.37.0-api
      cancel-in-progress: true
    steps:
      - name: Check out code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup KinD
        uses: ./.github/actions/setup-kind-cluster
        with:
          k8s-version: v1.37.0
          load-image: 'false'
      - name: Run existing API E2E tests
        uses: ./.github/actions/e2e-test
        with:
          suite: api-cli
          codecov-enable: true
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          image-artifact: ${{ env.E2E_IMAGE_ARTIFACT }}
          image-job: ${{ env.E2E_IMAGE_JOB }}
