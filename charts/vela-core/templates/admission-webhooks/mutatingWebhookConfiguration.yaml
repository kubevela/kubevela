{{- if .Values.admissionWebhooks.enabled -}}
{{- /* Webhooks already in the cluster, to keep their caBundle and failurePolicy on upgrade. */}}
{{- $hooks := include "kubevela.existingWebhooks" (dict "kind" "MutatingWebhookConfiguration" "name" (printf "%s-admission" (include "kubevela.fullname" .))) | fromJson -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ template "kubevela.fullname" . }}-admission
  namespace: {{ .Release.Namespace }}
  {{- if .Values.admissionWebhooks.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s-root-cert" .Release.Namespace (include "kubevela.fullname" .) | quote }}
  {{- end }}
webhooks:
  - clientConfig:
      {{- include "kubevela.webhookCABundle" (dict "root" $ "hooks" $hooks "name" "mutating.core.oam.dev.v1beta1.applications") | nindent 6 }}
      service:
        name: {{ template "kubevela.name" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutating-core-oam-dev-v1beta1-applications
    {{- include "kubevela.webhookFailurePolicy" (dict "root" $ "hooks" $hooks "name" "mutating.core.oam.dev.v1beta1.applications" "policy" "Fail") | nindent 4 }}
    name: mutating.core.oam.dev.v1beta1.applications
    admissionReviewVersions:
      - v1beta1
      - v1
    sideEffects: None
    rules:
      - apiGroups:
          - core.oam.dev
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - applications
  - clientConfig:
      {{- include "kubevela.webhookCABundle" (dict "root" $ "hooks" $hooks "name" "mutating.core.oam-dev.v1beta1.componentdefinitions") | nindent 6 }}
      service:
        name: {{ template "kubevela.name" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutating-core-oam-dev-v1beta1-componentdefinitions
    {{- include "kubevela.webhookFailurePolicy" (dict "root" $ "hooks" $hooks "name" "mutating.core.oam-dev.v1beta1.componentdefinitions" "policy" "Fail") | nindent 4 }}
    name: mutating.core.oam-dev.v1beta1.componentdefinitions
    sideEffects: None
    admissionReviewVersions:
      - v1beta1
      - v1
    rules:
      - apiGroups:
          - core.oam.dev
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - componentdefinitions

{{- end -}}
