{{ if .Values.multicluster.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cluster-gateway
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "kubevela.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.multicluster.clusterGateway.replicaCount }}
  selector:
    matchLabels:
    {{- include "kubevela-cluster-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9443"
        prometheus.io/scrape: "true"
        prometheus.io/scheme: "https"
      labels:
      {{- include "kubevela-cluster-gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubevela.serviceAccountName" . }}
      securityContext:
      {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "kubevela.fullname" . }}-cluster-gateway
          securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - "apiserver"
            - "--secure-port={{ .Values.multicluster.clusterGateway.port }}"
            - "--secret-namespace={{ .Release.Namespace }}"
            - "--feature-gates=APIPriorityAndFairness=false,ClientIdentityPenetration={{ .Values.authentication.enabled }}"
            - "--cluster-gateway-proxy-config=/etc/proxy-config/config.yaml"
            {{- if .Values.multicluster.clusterGateway.secureTLS.enabled }}
            - "--tls-cert-file={{ .Values.multicluster.clusterGateway.secureTLS.certPath }}/tls.crt"
            - "--tls-private-key-file={{ .Values.multicluster.clusterGateway.secureTLS.certPath }}/tls.key"
            {{- end }}
            - "--authorization-always-allow-paths=/healthz,/readyz,/livez,/metrics"
          image: {{ .Values.imageRegistry }}{{ .Values.multicluster.clusterGateway.image.repository }}:{{ .Values.multicluster.clusterGateway.image.tag }}
          imagePullPolicy: {{ .Values.multicluster.clusterGateway.image.pullPolicy }}
          resources:
          {{- toYaml .Values.multicluster.clusterGateway.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.multicluster.clusterGateway.port }}
          volumeMounts:
            - mountPath: /etc/proxy-config
              name: proxy-config
          {{ if .Values.multicluster.clusterGateway.secureTLS.enabled }}
            - mountPath: {{ .Values.multicluster.clusterGateway.secureTLS.certPath }}
              name: tls-cert-vol
              readOnly: true
          {{- end }}
      volumes:
        - configMap:
            defaultMode: 420
            name: {{ .Release.Name }}-cluster-gateway-proxy-config
          name: proxy-config
      {{ if .Values.multicluster.clusterGateway.secureTLS.enabled }}
        - name: tls-cert-vol
          secret:
            defaultMode: 420
            secretName: {{ template "kubevela.fullname" . }}-cluster-gateway-tls-v2
      {{ end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
      {{ if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
      {{ else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "kubevela-cluster-gateway.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
              weight: 100
      {{ end }}
      {{- with .Values.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-cluster-gateway-proxy-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    apiVersion: cluster.core.oam.dev/v1alpha1
    kind: ClusterGatewayProxyConfiguration
    spec:
      clientIdentityExchanger:
        rules:
          - name: super-user
            source:
              group: kubevela:ux
            type: PrivilegedIdentityExchanger
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cluster-gateway-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
  {{- include "kubevela-cluster-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.multicluster.clusterGateway.port }}
      targetPort: {{ .Values.multicluster.clusterGateway.port }}
      name: default
---
# 1.  Check whether APIService ""v1alpha1.cluster.core.oam.dev" is already present in the cluster
# 2.a If the APIService doesn't exist, create it.
# 2.b If the APIService exists without helm-chart related annotation, skip creating it to the
#     cluster because the APIService can be managed by an external controller.
# 2.c If the APIService exists with valid helm-chart annotations, which means that the APIService
#     is previously managed by helm commands, hence update the APIService consistently.
{{ $apiSvc := (lookup "apiregistration.k8s.io/v1" "APIService" "" "v1alpha1.cluster.core.oam.dev") }}
{{ $shouldAdopt := (not $apiSvc) }}
{{ if not $shouldAdopt }}
  {{ if $apiSvc.metadata.annotations }}
    {{ $shouldAdopt = (index ($apiSvc).metadata.annotations "meta.helm.sh/release-name") }}
  {{ end }}
{{ end }}
{{- /*
  TLS material for the APIService <-> cluster-gateway connection.

  Since Kubernetes 1.36 the aggregator verifies TLS with the APIService's caBundle for
  the availability check (kubernetes/kubernetes#137157), so a placeholder caBundle makes
  the APIService never become Available. vela-core waits for it at startup, so
  `helm install --wait` would deadlock before any post-install Job could write the CA.
  The chart therefore generates the CA and serving certificate itself, which gives the
  APIService a valid caBundle from the first render.

  - Fresh install: generate a CA and a serving certificate.
  - Upgrade: reuse the existing Secret (found via lookup) so certificates do not rotate on
    every `helm upgrade`, and keep the existing valid caBundle.
  - A Secret that exists but is not owned by Helm (created by the legacy tls-secret-create
    Job) is reused as it is and not rendered again, because Helm cannot adopt it.
  - `helm template` and tools without cluster access cannot run lookup, so they render
    fresh certificates. Set multicluster.clusterGateway.secureTLS.generateCerts=false to
    use the legacy Job based flow there.
  The Secret and the APIService are rendered from this one block so they always share the
  same CA: genCA must run only once per render.
*/ -}}
{{- $secureTLS := .Values.multicluster.clusterGateway.secureTLS }}
{{- $generateTLS := and $secureTLS.enabled (not $secureTLS.certManager.enabled) $secureTLS.generateCerts }}
{{- $tlsSecretName := printf "%s-cluster-gateway-tls-v2" (include "kubevela.fullname" .) }}
{{- $tlsCA := "" }}
{{- $tlsCrt := "" }}
{{- $tlsKey := "" }}
{{- $renderTLSSecret := true }}
{{- if $generateTLS }}
  {{- $tlsSecret := lookup "v1" "Secret" .Release.Namespace $tlsSecretName }}
  {{- if and $tlsSecret $tlsSecret.data }}
    {{- /* The controller reads the CA from the "ca" key, cert-manager style consumers from "ca.crt". */}}
    {{- $tlsCA = (index $tlsSecret.data "ca") | default (index $tlsSecret.data "ca.crt") | default "" }}
    {{- $tlsCrt = (index $tlsSecret.data "tls.crt") | default "" }}
    {{- $tlsKey = (index $tlsSecret.data "tls.key") | default "" }}
    {{- /* The legacy Job wrote the CA into the APIService, not into the Secret key we read. */}}
    {{- if and (not $tlsCA) $apiSvc $apiSvc.spec $apiSvc.spec.caBundle (ne $apiSvc.spec.caBundle "Cg==") }}
      {{- $tlsCA = $apiSvc.spec.caBundle }}
    {{- end }}
    {{- $renderTLSSecret = false }}
    {{- if $tlsSecret.metadata.annotations }}
      {{- if index $tlsSecret.metadata.annotations "meta.helm.sh/release-name" }}
        {{- $renderTLSSecret = true }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if not (and $tlsCA $tlsCrt $tlsKey) }}
    {{- if not $renderTLSSecret }}
      {{- fail (printf "Secret %s/%s already exists but is not managed by Helm and has no usable CA, certificate and key. Delete it, or set multicluster.clusterGateway.secureTLS.generateCerts=false." .Release.Namespace $tlsSecretName) }}
    {{- end }}
    {{- $svcName := printf "%s-cluster-gateway-service" .Release.Name }}
    {{- $caCert := genCA (printf "%s-cluster-gateway-ca" .Release.Name) 3650 }}
    {{- $servingCert := genSignedCert $svcName nil (list $svcName (printf "%s.%s.svc" $svcName .Release.Namespace) (printf "%s.%s.svc.cluster.local" $svcName .Release.Namespace)) 3650 $caCert }}
    {{- $tlsCA = b64enc $caCert.Cert }}
    {{- $tlsCrt = b64enc $servingCert.Cert }}
    {{- $tlsKey = b64enc $servingCert.Key }}
  {{- end }}
{{- end }}
{{- if and $generateTLS $renderTLSSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "kubevela.labels" . | nindent 4 }}
type: Opaque
data:
  ca: {{ $tlsCA }}
  ca.crt: {{ $tlsCA }}
  tls.crt: {{ $tlsCrt }}
  tls.key: {{ $tlsKey }}
---
{{- end }}
{{ if $shouldAdopt }}
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.cluster.core.oam.dev
  annotations:
    {{- if and .Values.multicluster.clusterGateway.secureTLS.enabled .Values.multicluster.clusterGateway.secureTLS.certManager.enabled }}
    cert-manager.io/inject-ca-from: "{{ .Release.Namespace }}/{{ template "kubevela.fullname" . }}-cluster-gateway-tls-v2"
    {{- end }}
  labels:
    api: cluster-extension-apiserver
    apiserver: "true"
spec:
  version: v1alpha1
  group: cluster.core.oam.dev
  groupPriorityMinimum: 2000
  service:
    name: {{ .Release.Name }}-cluster-gateway-service
    namespace: {{ .Release.Namespace }}
    port: {{ .Values.multicluster.clusterGateway.port }}
  versionPriority: 10
  {{- if not .Values.multicluster.clusterGateway.secureTLS.enabled }}
  insecureSkipTLSVerify: true
  {{- else if $generateTLS }}
  insecureSkipTLSVerify: false
  caBundle: {{ $tlsCA }}
  {{- else }}
  {{- /* cert-manager or the legacy Job flow (generateCerts=false). Preserve an
         already-valid caBundle on upgrade so we don't reset it before the patch Job
         re-runs. $apiSvc is the existing APIService looked up above. */}}
  {{- $caBundle := "" }}
  {{- if $apiSvc }}
    {{- if $apiSvc.spec }}
      {{- if hasKey $apiSvc.spec "caBundle" }}
        {{- if and $apiSvc.spec.caBundle (ne $apiSvc.spec.caBundle "Cg==") }}
          {{- $caBundle = $apiSvc.spec.caBundle }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if $caBundle }}
  insecureSkipTLSVerify: false
  caBundle: {{ $caBundle }}
  {{- else if .Values.multicluster.clusterGateway.secureTLS.certManager.enabled }}
  {{- /* cert-manager's cainjector fills in the caBundle on its own. */}}
  insecureSkipTLSVerify: false
  caBundle: Cg==
  {{- else }}
  {{- /* Legacy Job flow without a CA yet: the tls-secret-create Job makes it during
         the install and the post-install tls-secret-patch Job writes it here and
         sets insecureSkipTLSVerify to false. Until then TLS is not verified. A
         placeholder caBundle would not work on Kubernetes 1.36+ (see above). */}}
  insecureSkipTLSVerify: true
  {{- end }}
  {{- end }}
{{ end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubevela.fullname" . }}:cluster-gateway:proxy
rules:
  - apiGroups: [ "cluster.core.oam.dev" ]
    resources: [ "clustergateways/proxy" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubevela.fullname" . }}:cluster-gateway:proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubevela.fullname" . }}:cluster-gateway:proxy
subjects:
  - kind: Group
    name: kubevela:client
    apiGroup: rbac.authorization.k8s.io
  - kind: ServiceAccount
    name: {{ include "kubevela.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{ end }}
