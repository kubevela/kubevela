---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: configs.config.oam.dev
spec:
  group: config.oam.dev
  names:
    categories:
    - oam
    kind: Config
    listKind: ConfigList
    plural: configs
    shortNames:
    - cfg
    singular: config
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.templateRef.name
      name: TEMPLATE
      type: string
    - jsonPath: .status.phase
      name: PHASE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Config is the CRD-native replacement for the legacy labeled-Secret
          config convention.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ConfigSpec defines the desired state of Config.
            properties:
              alias:
                type: string
              description:
                type: string
              properties:
                description: Properties and PropertiesFrom are mutually exclusive.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              propertiesFrom:
                description: PropertiesReference sources properties from a Secret
                  instead of storing them inline.
                properties:
                  secretRef:
                    description: SecretKeySelector selects a key of a Secret in the
                      Config's own namespace.
                    properties:
                      key:
                        description: Key defaults to "properties".
                        type: string
                      name:
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretRef
                type: object
              templateRef:
                description: |-
                  TemplateRef is the ConfigTemplate (or legacy ConfigMap) to render against. If
                  empty, Properties are materialized as-is with no template evaluation.
                properties:
                  name:
                    type: string
                  namespace:
                    description: Namespace defaults to "vela-system" if empty.
                    type: string
                required:
                - name
                type: object
            type: object
          status:
            description: ConfigStatus defines the observed state of Config.
            properties:
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              expandedWriter:
                description: |-
                  ExpandedWriter records the last confirmed sync of the template's expanded writer
                  block (today: nacos), published or found current. Unset when the template has no
                  such block.
                properties:
                  nacos:
                    description: |-
                      NacosSyncStatus is the last confirmed sync of the template's nacos block: where the
                      content lives in Nacos and a hash of the content and its target, recorded both when
                      the controller published and when it found Nacos already current (a config adopted
                      from the CLI, say), so the next reconcile publishes again only when the rendered
                      content or its target changes.
                    properties:
                      contentHash:
                        type: string
                      dataId:
                        type: string
                      endpoint:
                        description: |-
                          Endpoint is the endpoint config (the config made from the nacos-server template) the
                          template names, recorded on every sync attempt whether it succeeded or not, so a
                          change to that config re-triggers exactly the Configs that use it, including the
                          ones still waiting for it to exist.
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      endpointHash:
                        description: |-
                          EndpointHash is a digest of that endpoint config's server part (addresses, ports,
                          discovery endpoint, region), never its credentials. A changed endpoint, another
                          server say, is re-synced like changed content: read first, published only when the
                          server does not hold it. Rotated credentials change nothing in Nacos and are not
                          part of it; the status is readable by whoever can read Configs.
                        type: string
                      group:
                        type: string
                      lastSyncTime:
                        description: |-
                          LastSyncTime is when the content was last confirmed current in Nacos, by a
                          publish or by a read that found it already there.
                        format: date-time
                        type: string
                    required:
                    - contentHash
                    - dataId
                    - group
                    type: object
                type: object
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation the rest of the status describes, so a
                  reader can tell an Available from the last spec apart from one for the current
                  spec; the create-config workflow step waits on it.
                format: int64
                type: integer
              phase:
                description: ConfigPhase describes the lifecycle phase of a Config.
                type: string
              secretRef:
                description: |-
                  LocalObjectReference contains enough information to let you locate the
                  referenced object inside the same namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
