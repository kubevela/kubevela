    cert-manager.io/inject-ca-from: vela-system/kubevela-vela-core-root-cert
    controller-gen.kubebuilder.io/version: v0.16.5
  name: applications.core.oam.dev
spec:
  group: core.oam.dev
  names:
    categories:
    - oam
    kind: Application
    listKind: ApplicationList
    plural: applications
    shortNames:
    - app
    - velaapp
    singular: application
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.components[*].name
      name: COMPONENT
      type: string
    - jsonPath: .spec.components[*].type
      name: TYPE
      type: string
    - jsonPath: .status.status
      name: PHASE
      type: string
    - jsonPath: .status.services[*].healthy
      name: HEALTHY
      type: boolean
    - jsonPath: .status.services[*].message
      name: STATUS
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Application is the Schema for the applications API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ApplicationSpec is the spec of Application
            properties:
              components:
                items:
                  description: ApplicationComponent describe the component of application
                  properties:
                    dependsOn:
                      items:
                        type: string
                      type: array
                    externalRevision:
                      description: ExternalRevision specified the component revisionName
                      type: string
                    inputs:
                      description: StepInputs defines variable input of WorkflowStep
                      items:
                        description: InputItem defines an input variable of WorkflowStep
                        properties:
                          from:
                            type: string
                          parameterKey:
                            type: string
                        required:
                        - from
                        type: object
                      type: array
                    name:
                      type: string
                    outputs:
                      description: StepOutputs defines output variable of WorkflowStep
                      items:
                        description: OutputItem defines an output variable of WorkflowStep
                        properties:
                          name:
                            type: string
                          valueFrom:
                            type: string
                        required:
                        - name
                        - valueFrom
                        type: object
                      type: array
                    properties:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    scopes:
                      additionalProperties:
                        type: string
                      description: |-
                        scopes in ApplicationComponent defines the component-level scopes
                        the format is <scope-type:scope-instance-name> pairs, the key represents type of `ScopeDefinition` while the value represent the name of scope instance.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    traits:
                      description: Traits define the trait of one component, the type
                        must be array to keep the order.
                      items:
                        description: ApplicationTrait defines the trait of application
                        properties:
                          properties:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          type:
                            type: string
                        required:
                        - type
                        type: object
                      type: array
                    type:
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              policies:
                description: |-
                  Policies defines the global policies for all components in the app, e.g. security, metrics, gitops,
                  multi-cluster placement rules, etc.
                  Policies are applied after components are rendered and before workflow steps are executed.
                items:
                  description: AppPolicy defines a global policy for all components
                    in the app.
                  properties:
                    name:
                      description: Name is the unique name of the policy.
                      type: string
                    properties:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type:
                      description: Type is the type of the policy
                      type: string
                  required:
                  - type
                  type: object
                type: array
              sources:
                description: Sources defines external sources that properties can
                  read with $(source...).
                items:
                  description: ApplicationSource defines a source binding under spec.sources.
                  properties:
                    autoUpdate:
                      description: |-
                        AutoUpdate controls whether a change to this source's resolved value
                        re-dispatches the components and traits that read it, without waiting for
                        the workflow to run again.

                        Unset defers to the EnableSourceAutoUpdate feature gate, so a platform can
                        set the fleet-wide default and an Application can disagree per binding: a
                        registry address worth picking up immediately and a feature flag that
                        should wait for the next rollout can sit side by side.

                        A publishVersion pin overrides this in both directions. An explicit pin is
                        hard, so nothing re-dispatches until the pin is bumped.
                      type: boolean
                    name:
                      type: string
                    properties:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    statusPolicy:
                      description: StatusPolicy controls what source resolution details
                        are exposed on Application status.
                      properties:
                        exposeConsumedValues:
                          description: |-
                            ExposeConsumedValues controls whether the values a reader took from this
                            source are written to status. When false the properties that read it are
                            still listed, without their values.

                            Unset means expose, so the knobs in this struct stay independent: asking
                            for one path to be masked is a narrower request than asking for silence,
                            and must not be read as the wider one.
                          type: boolean
                        maskPaths:
                          description: |-
                            MaskPaths redacts source attributes before they are written to status, in
                            addition to those the definition marks +sensitive. Paths are dot-delimited,
                            for example "nested.token".
                          items:
                            type: string
                          type: array
                      type: object
                    type:
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              workflow:
                description: |-
                  Workflow defines how to customize the control logic.
                  If workflow is specified, Vela won't apply any resource, but provide rendered output in AppRevision.
                  Workflow steps are executed in array order, and each step:
                  - will have a context in annotation.
                  - should mark "finish" phase in status.conditions.
                properties:
                  mode:
                    description: WorkflowExecuteMode defines the mode of workflow
                      execution
                    properties:
                      steps:
                        description: Steps is the mode of workflow steps execution
                        type: string
                      subSteps:
                        description: SubSteps is the mode of workflow sub steps execution
                        type: string
                    type: object
                  ref:
                    type: string
                  steps:
                    items:
                      description: WorkflowStep defines how to execute a workflow
                        step.
                      properties:
                        dependsOn:
                          description: DependsOn is the dependency of the step
                          items:
                            type: string
                          type: array
                        if:
                          description: If is the if condition of the step
                          type: string
                        inputs:
                          description: Inputs is the inputs of the step
                          items:
                            description: InputItem defines an input variable of WorkflowStep
                            properties:
                              from:
                                type: string
                              parameterKey:
                                type: string
                            required:
                            - from
                            type: object
                          type: array
                        meta:
                          description: Meta is the meta data of the workflow step.
                          properties:
                            alias:
                              type: string
                          type: object
                        mode:
                          description: Mode is only valid for sub steps, it defines
                            the mode of the sub steps
                          nullable: true
                          type: string
                        name:
                          description: Name is the unique name of the workflow step.
                          type: string
                        outputs:
                          description: Outputs is the outputs of the step
                          items:
                            description: OutputItem defines an output variable of
                              WorkflowStep
                            properties:
                              name:
                                type: string
                              valueFrom:
                                type: string
                            required:
                            - name
                            - valueFrom
                            type: object
                          type: array
                        properties:
                          description: Properties is the properties of the step
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        subSteps:
                          items:
                            description: WorkflowStepBase defines the workflow step
                              base
                            properties:
                              dependsOn:
                                description: DependsOn is the dependency of the step
                                items:
                                  type: string
                                type: array
                              if:
                                description: If is the if condition of the step
                                type: string
                              inputs:
                                description: Inputs is the inputs of the step
                                items:
                                  description: InputItem defines an input variable
                                    of WorkflowStep
                                  properties:
                                    from:
                                      type: string
                                    parameterKey:
                                      type: string
                                  required:
                                  - from
                                  type: object
                                type: array
                              meta:
                                description: Meta is the meta data of the workflow
                                  step.
                                properties:
                                  alias:
                                    type: string
                                type: object
                              name:
                                description: Name is the unique name of the workflow
                                  step.
                                type: string
                              outputs:
                                description: Outputs is the outputs of the step
                                items:
                                  description: OutputItem defines an output variable
                                    of WorkflowStep
                                  properties:
                                    name:
                                      type: string
                                    valueFrom:
                                      type: string
                                  required:
                                  - name
                                  - valueFrom
                                  type: object
                                type: array
                              properties:
                                description: Properties is the properties of the step
                                type: object
                                x-kubernetes-preserve-unknown-fields: true
                              timeout:
                                description: Timeout is the timeout of the step
                                type: string
                              type:
                                description: Type is the type of the workflow step.
                                type: string
                            required:
                            - type
                            type: object
                          type: array
                        timeout:
                          description: Timeout is the timeout of the step
                          type: string
                        type:
                          description: Type is the type of the workflow step.
                          type: string
                      required:
                      - type
                      type: object
                    type: array
                type: object
            required:
            - components
            type: object
          status:
            description: AppStatus defines the observed state of Application
            properties:
              applicationPoliciesConfigMap:
                description: |-
                  ApplicationPoliciesConfigMap references the ConfigMap containing rendered policy outputs
                  Format: "application-policies-{namespace}-{name}"
                type: string
              appliedApplicationPolicies:
                description: |-
                  AppliedApplicationPolicies lists Application-scoped policies (both global and explicit)
                  that were discovered and applied (or skipped) during reconciliation.
                items:
                  description: |-
                    AppliedApplicationPolicy records minimal status information about an Application-scoped policy.
                    This covers both global (auto-discovered) and explicit (spec-referenced) policies.
                    Full details (transforms, labels, annotations, etc.) are stored in the ConfigMap referenced
                    by ApplicationPoliciesConfigMap for persistent storage and observability.
                  properties:
                    annotationsCount:
                      type: integer
                    applied:
                      type: boolean
                    definitionRevisionName:
                      description: |-
                        Version tracking
                        DefinitionRevisionName is the DefinitionRevision resource name if a versioned policy was used (e.g., "my-policy-v3")
                        Empty if the policy wasn't versioned (used latest PolicyDefinition)
                      type: string
                    error:
                      type: boolean
                    hasContext:
                      type: boolean
                    labelsCount:
                      type: integer
                    message:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    revision:
                      description: Revision is the revision number from the DefinitionRevision
                        (e.g. 3)
                      format: int64
                      type: integer
                    revisionHash:
                      description: |-
                        RevisionHash is the hash of the PolicyDefinition template from the DefinitionRevision
                        This is the definitive proof of exactly what template was used
                      type: string
                    source:
                      type: string
                    specModified:
                      type: boolean
                    type:
                      type: string
                  required:
                  - applied
                  - name
                  - namespace
                  type: object
                type: array
              appliedResources:
                description: AppliedResources record the resources that the  workflow
                  step apply.
                items:
                  description: ClusterObjectReference defines the object reference
                    with cluster.
                  properties:
                    apiVersion:
                      description: API version of the referent.
                      type: string
                    cluster:
                      type: string
                    creator:
                      type: string
                    fieldPath:
                      description: |-
                        If referring to a piece of an object instead of an entire object, this string
                        should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                        For example, if the object reference is to a container within a pod, this would take on a value like:
                        "spec.containers{name}" (where "name" refers to the name of the container that triggered
                        the event) or if no container name is specified "spec.containers[2]" (container with
                        index 2 in this pod). This syntax is chosen only to have some well-defined way of
                        referencing a part of an object.
                      type: string
                    kind:
                      description: |-
                        Kind of the referent.
                        More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                      type: string
                    name:
                      description: |-
                        Name of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                    namespace:
                      description: |-
                        Namespace of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                      type: string
                    resourceVersion:
                      description: |-
                        Specific resourceVersion to which this reference is made, if any.
                        More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                      type: string
                    uid:
                      description: |-
                        UID of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              components:
                description: Components record the related Components created by Application
                  Controller
                items:
                  description: ObjectReference contains enough information to let
                    you inspect or modify the referred object.
                  properties:
                    apiVersion:
                      description: API version of the referent.
                      type: string
                    fieldPath:
                      description: |-
                        If referring to a piece of an object instead of an entire object, this string
                        should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                        For example, if the object reference is to a container within a pod, this would take on a value like:
                        "spec.containers{name}" (where "name" refers to the name of the container that triggered
                        the event) or if no container name is specified "spec.containers[2]" (container with
                        index 2 in this pod). This syntax is chosen only to have some well-defined way of
                        referencing a part of an object.
                      type: string
                    kind:
                      description: |-
                        Kind of the referent.
                        More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                      type: string
                    name:
                      description: |-
                        Name of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                    namespace:
                      description: |-
                        Namespace of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                      type: string
                    resourceVersion:
                      description: |-
                        Specific resourceVersion to which this reference is made, if any.
                        More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                      type: string
                    uid:
                      description: |-
                        UID of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              latestRevision:
                description: LatestRevision of the application configuration it generates
                properties:
                  name:
                    type: string
                  revision:
                    format: int64
                    type: integer
                  revisionHash:
                    description: RevisionHash record the hash value of the spec of
                      ApplicationRevision object.
                    type: string
                required:
                - name
                - revision
                type: object
              observedGeneration:
                description: The generation observed by the application controller.
                format: int64
                type: integer
              policy:
                description: |-
                  PolicyStatus records the status of policy
                  Deprecated This field is only used by EnvBinding Policy which is deprecated.
                items:
                  description: |-
                    PolicyStatus records the status of policy
                    Deprecated
                  properties:
                    name:
                      type: string
                    status:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type:
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              services:
                description: Services record the status of the application services
                items:
                  description: ApplicationComponentStatus record the health status
                    of App component
                  properties:
                    cluster:
                      type: string
                    details:
                      additionalProperties:
                        type: string
                      type: object
                    env:
                      type: string
                    healthy:
                      type: boolean
                    message:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    scopes:
                      items:
                        description: ObjectReference contains enough information to
                          let you inspect or modify the referred object.
                        properties:
                          apiVersion:
                            description: API version of the referent.
                            type: string
                          fieldPath:
                            description: |-
                              If referring to a piece of an object instead of an entire object, this string
                              should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                              For example, if the object reference is to a container within a pod, this would take on a value like:
                              "spec.containers{name}" (where "name" refers to the name of the container that triggered
                              the event) or if no container name is specified "spec.containers[2]" (container with
                              index 2 in this pod). This syntax is chosen only to have some well-defined way of
                              referencing a part of an object.
                            type: string
                          kind:
                            description: |-
                              Kind of the referent.
                              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                            type: string
                          name:
                            description: |-
                              Name of the referent.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          namespace:
                            description: |-
                              Namespace of the referent.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                            type: string
                          resourceVersion:
                            description: |-
                              Specific resourceVersion to which this reference is made, if any.
                              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                            type: string
                          uid:
                            description: |-
                              UID of the referent.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      type: array
                    traits:
                      items:
                        description: ApplicationTraitStatus records the trait health
                          status
                        properties:
                          details:
                            additionalProperties:
                              type: string
                            type: object
                          healthy:
                            type: boolean
                          message:
                            type: string
                          pending:
                            type: boolean
                          type:
                            type: string
                        required:
                        - healthy
                        - type
                        type: object
                      type: array
                    workloadDefinition:
                      description: WorkloadDefinition is the definition of a WorkloadDefinition,
                        such as deployments/apps.v1
                      properties:
                        apiVersion:
                          type: string
                        kind:
                          type: string
                      required:
                      - apiVersion
                      - kind
                      type: object
                    workloadHealthy:
                      description: WorkloadHealthy indicates the workload health without
                        considering trait health.
                      type: boolean
                  required:
                  - healthy
                  - name
                  type: object
                type: array
              sources:
                description: |-
                  Sources reports each spec.sources[] binding: whether it resolved, what
                  backs it, when that expires, whether it auto-updates, and who read it.

                  Application-level because a binding is declared once for the whole
                  Application. The per-component list under Services says only what that
                  component consumed.
                items:
                  description: ApplicationSourceStatus records source resolution status.
                  properties:
                    autoUpdate:
                      description: |-
                        AutoUpdate reports whether a change to this binding re-dispatches the
                        components reading it, after the feature gate, the binding's own setting and
                        any publishVersion pin have all been resolved. When it is false and the
                        binding asked for true, Message says which of them won.
                      type: boolean
                    consumedBy:
                      description: |-
                        ConsumedBy records who read this source and what each of them got.

                        Consumption hangs off the source rather than off each consumer because the
                        consumers do not all have somewhere to put it: a workflow step's status is
                        workflowv1alpha1.WorkflowStepStatus, owned by the workflow repo, and that
                        engine is deliberately unaware sources exist - properties are substituted
                        before it ever sees them.
                      items:
                        description: SourceConsumer records one reader of a source
                          and the values it received.
                        properties:
                          cluster:
                            description: |-
                              Cluster and Namespace place the read. The same binding resolves separately
                              per cluster when its cache key varies by one, so two entries here may
                              legitimately hold different values, and an override policy can put the same
                              component in two namespaces of one cluster.
                            type: string
                          definitionKind:
                            description: |-
                              DefinitionKind is the kind of definition that read it: component, trait,
                              workflowstep or policy.
                            type: string
                          name:
                            description: |-
                              Name identifies the reader within its kind - the component, the step, the
                              policy. A trait is named "<component>/<trait>", since a trait has no
                              identity apart from the component it is attached to.
                            type: string
                          namespace:
                            type: string
                          type:
                            description: |-
                              Type is the reader's own definition type, e.g. "webservice", so a reader can
                              be understood without cross-referencing the spec.
                            type: string
                          values:
                            description: |-
                              Values are what this reader took, each saying which source attribute was
                              read and which of the reader's properties received it. A list rather than a
                              map because one source attribute can feed several properties, and one
                              property can be assembled from several attributes -
                              "host: $(source.db.addr):$(source.db.port)" is two values into one
                              property, which a map cannot express.

                              Attributes the definition marks sensitive, and any the binding's
                              statusPolicy masks, are redacted here exactly as they are elsewhere.
                            items:
                              description: 'SourceValue is one value taken from a
                                source: what was read and where it went.'
                              properties:
                                property:
                                  description: |-
                                    Property is the reader's property that received it, e.g. "image" or
                                    "env[0].value".
                                  type: string
                                sourceAttr:
                                  description: SourceAttr is the attribute of the
                                    source that was read, e.g. "data.image".
                                  type: string
                                value:
                                  description: |-
                                    Value is what was read, redacted where the attribute is sensitive or masked.

                                    Schemaless because a source value is whatever the source returns - a string,
                                    a number, a list, a struct. RawExtension alone generates "type: object",
                                    which rejects every scalar and takes the whole status write down with it.
                                  x-kubernetes-preserve-unknown-fields: true
                              required:
                              - sourceAttr
                              type: object
                            type: array
                        required:
                        - definitionKind
                        - name
                        type: object
                      type: array
                    message:
                      description: |-
                        Message explains a result about the binding as a whole - most often why
                        AutoUpdate is false on a binding that asked for true. A failure to resolve
                        belongs to the entry that failed, and is reported on that Resolution.
                      type: string
                    name:
                      description: Name is the spec.sources[] binding this reports
                        on.
                      type: string
                    phase:
                      description: |-
                        Phase is Resolved, Stale, Failed or Unused. Stale means a refresh failed and
                        the previous value is still being served, which is a working Application
                        with data that has stopped moving - the case a bare healthy/unhealthy cannot
                        express.
                      type: string
                    resolutions:
                      description: |-
                        Resolutions are the cache entries backing this binding.

                        More than one when the binding's cache key varies by something that varies -
                        most often the cluster, since a source keying on context.cluster resolves
                        separately in each. Collapsing them into a single config and expiry meant
                        status named one entry when there were three, and named it arbitrarily.
                      items:
                        description: |-
                          SourceResolution is one stored entry backing a binding, and the state of it.

                          Keyed by the storage key rather than by cluster because the key is what a
                          resolution is. A source keyed on the cluster has an entry per cluster; one
                          keyed on the component has an entry per component within a single cluster; one
                          keyed on nothing has a single entry serving everything. Cluster is only ever
                          one of the things a key may vary by.
                        properties:
                          clusters:
                            description: |-
                              Clusters this entry served, as context. Not the identity: a cache key may
                              vary by namespace, appName, componentName or a label just as readily as by
                              cluster, so two entries can serve one cluster and one entry can serve
                              several.
