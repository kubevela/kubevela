---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: traitdefinitions.core.oam.dev
spec:
  group: core.oam.dev
  names:
    categories:
    - oam
    kind: TraitDefinition
    listKind: TraitDefinitionList
    plural: traitdefinitions
    shortNames:
    - trait
    singular: traitdefinition
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.appliesToWorkloads
      name: APPLIES-TO
      type: string
    - jsonPath: .metadata.annotations.definition\.oam\.dev/description
      name: DESCRIPTION
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          A TraitDefinition registers a kind of Kubernetes custom resource as a valid
          OAM trait kind by referencing its CustomResourceDefinition. The CRD is used
          to validate the schema of the trait when it is embedded in an OAM
          ApplicationConfiguration.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A TraitDefinitionSpec defines the desired state of a TraitDefinition.
            properties:
              appliesToWorkloads:
                description: |-
                  AppliesToWorkloads specifies the list of workload kinds this trait
                  applies to. Workload kinds are specified in resource.group/version format,
                  e.g. server.core.oam.dev/v1alpha2. Traits that omit this field apply to
                  all workload kinds.
                items:
                  type: string
                type: array
              conflictsWith:
                description: |-
                  ConflictsWith specifies the list of traits(CRD name, Definition name, CRD group)
                  which could not apply to the same workloads with this trait.
                  Traits that omit this field can work with any other traits.
                  Example rules:
                  "service" # Trait definition name
                  "services.k8s.io" # API resource/crd name
                  "*.networking.k8s.io" # API group
                  "labelSelector:foo=bar" # label selector
                  labelSelector format: https://pkg.go.dev/k8s.io/apimachinery/pkg/labels#Parse
                items:
                  type: string
                type: array
              controlPlaneOnly:
                description: ControlPlaneOnly defines which cluster is dispatched
                  to
                type: boolean
              definitionRef:
                description: Reference to the CustomResourceDefinition that defines
                  this trait kind.
                properties:
                  name:
                    description: Name of the referenced CustomResourceDefinition.
                    type: string
                  version:
                    description: |-
                      Version indicate which version should be used if CRD has multiple versions
                      by default it will use the first one if not specified
                    type: string
                required:
                - name
                type: object
              extension:
                description: Extension is used for extension needs by OAM platform
                  builders
                type: object
                x-kubernetes-preserve-unknown-fields: true
              manageWorkload:
                description: ManageWorkload defines the trait would be responsible
                  for creating the workload
                type: boolean
              podDisruptive:
                description: |-
                  PodDisruptive indicates that this trait is disruptive to the pod: applying or
                  updating it should cause the workload's pods to restart. If the trait's CUE
                  template patches the workload's pod template directly (`patch:` on
                  `spec.template`), the restart happens automatically via the normal Kubernetes
                  rollout mechanism and this field is not required.

                  If the trait instead renders separate objects via `outputs:` (e.g. a ConfigMap
                  consumed by the workload), set this to true so KubeVela stamps a content hash of
                  the trait's rendered output onto the workload's pod template annotations
                  (`app.oam.dev/trait-restart-hash-<traitType>`). This causes the pod template to
                  change whenever the trait's applied configuration changes, which in turn causes
                  the owning controller (Deployment/StatefulSet/CloneSet/...) to roll the pods.
                  Workloads without a `spec.template` (e.g. a bare Service) are unaffected.
                type: boolean
              restrictions:
                description: |-
                  Restrictions limits where this definition may be used. Absent or empty means
                  usable anywhere. A non-empty block overrides the
                  definition.oam.dev/restrict-namespaces annotation.
                properties:
                  namespaceSelector:
                    description: |-
                      NamespaceSelector selects those namespaces by label instead, for membership
                      that is not a naming convention. An empty selector matches every namespace;
                      leave the field unset to express no opinion.

                      Anyone who can label a namespace can bring it into scope, which a name glob
                      does not allow without the right to create namespaces.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  namespaces:
                    description: |-
                      Namespaces are the namespaces whose Applications may use this definition, as
                      names or globs ("tenant-*", matched with path.Match).
                    items:
                      type: string
                    type: array
                  quota:
                    description: |-
                      Quota limits how many uses of this definition one namespace may contain. The
                      first entry matching the namespace applies, so an entry with no matcher reads
                      as the default and belongs last. Absent or empty means unlimited.

                      Only ComponentDefinition and TraitDefinition are counted, and a quota on any
                      other kind is rejected when the definition is written. A namespace
                      accumulates components and the traits on them; a policy, workflow step or
                      source is part of how one Application is assembled.

                      The system namespace is never subject to a quota: addons install their own
                      Applications there using these definitions.
                    items:
                      description: |-
                        NamespaceQuota caps how many uses of a definition the namespaces it matches may
                        contain. Its matcher fields carry the same meaning as the ones on
                        DefinitionRestrictions, and an entry with neither matches every namespace.

                        Warn and Limit are both optional, and at least one must be set. Warn alone never
                        refuses, which is how a quota is introduced before it is enforced.
                      properties:
                        limit:
                          description: |-
                            Limit is the most uses of this definition the namespace may contain. Omit to
                            warn without ever refusing; zero forbids the type outright.
                          format: int32
                          minimum: 0
                          type: integer
                        namespaceSelector:
                          description: |-
                            NamespaceSelector selects those namespaces by label instead. It and
                            Namespaces are alternatives, so either one matching selects the entry.
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                          x-kubernetes-map-type: atomic
                        namespaces:
                          description: |-
                            Namespaces are the namespaces this entry applies to, as names or globs
                            ("tenant-*", matched with path.Match). Leave both matchers unset to make the
                            entry the default.
                          items:
                            type: string
                          type: array
                        warn:
                          description: |-
                            Warn is the count at or above which the Application is admitted with a
                            warning.
                          format: int32
                          minimum: 0
                          type: integer
                      type: object
                    type: array
                type: object
              revisionEnabled:
                description: Revision indicates whether a trait is aware of component
                  revision
                type: boolean
              schematic:
                description: |-
                  Schematic defines the data format and template of the encapsulation of the trait.
                  Only CUE and Kube schematic are supported for now.
                properties:
                  cue:
                    description: CUE defines the encapsulation in CUE format
                    properties:
                      template:
                        description: |-
                          Template defines the abstraction template data of the capability, it will replace the old CUE template in extension field.
                          Template is a required field if CUE is defined in Capability Definition.
                        type: string
                    required:
                    - template
                    type: object
                  terraform:
                    description: Terraform is the struct to describe cloud resources
                      managed by Hashicorp Terraform
                    properties:
                      configuration:
                        description: Configuration is Terraform Configuration
                        type: string
                      customRegion:
                        description: Region is cloud provider's region. It will override
                          the region in the region field of ProviderReference
                        type: string
                      deleteResource:
                        default: true
                        description: DeleteResource will determine whether provisioned
                          cloud resources will be deleted when CR is deleted
                        type: boolean
                      gitCredentialsSecretReference:
                        description: GitCredentialsSecretReference specifies the reference
                          to the secret containing the git credentials
                        properties:
                          name:
                            description: name is unique within a namespace to reference
                              a secret resource.
                            type: string
                          namespace:
                            description: namespace defines the space within which
                              the secret name must be unique.
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      path:
                        description: Path is the sub-directory of remote git repository.
                          It's valid when remote is set
                        type: string
                      providerRef:
                        description: ProviderReference specifies the reference to
                          Provider
                        properties:
                          name:
                            description: Name of the referenced object.
                            type: string
                          namespace:
                            default: default
                            description: Namespace of the referenced object.
                            type: string
                        required:
                        - name
                        type: object
                      type:
                        default: hcl
                        description: Type specifies which Terraform configuration
                          it is, HCL or JSON syntax
                        enum:
                        - hcl
                        - json
                        - remote
                        type: string
                      writeConnectionSecretToRef:
                        description: |-
                          WriteConnectionSecretToReference specifies the namespace and name of a
                          Secret to which any connection details for this managed resource should
                          be written. Connection details frequently include the endpoint, username,
                          and password required to connect to the managed resource.
                        properties:
                          name:
                            description: Name of the secret.
                            type: string
                          namespace:
                            description: Namespace of the secret.
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - configuration
                    type: object
                type: object
              stage:
                description: |-
                  Stage defines the stage information to which this trait resource processing belongs.
                  Currently, PreDispatch and PostDispatch are provided, which are used to control resource
                  pre-process and post-process respectively.
                type: string
              status:
                description: Status defines the custom health policy and status message
                  for trait
                properties:
                  customStatus:
                    description: CustomStatus defines the custom status message that
                      could display to user
                    type: string
                  details:
                    description: Details stores a string representation of a CUE status
                      map to be evaluated at runtime for display
                    type: string
                  healthPolicy:
                    description: HealthPolicy defines the health check policy for
                      the abstraction
                    type: string
                type: object
              version:
                type: string
              workloadRefPath:
                description: WorkloadRefPath indicates where/if a trait accepts a
                  workloadRef object
                type: string
            type: object
          status:
            description: TraitDefinitionStatus is the status of TraitDefinition
            properties:
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              configMapRef:
                description: ConfigMapRef refer to a ConfigMap which contains OpenAPI
                  V3 JSON schema of Component parameters.
                type: string
              latestRevision:
                description: LatestRevision of the component definition
                properties:
                  name:
                    type: string
                  revision:
                    format: int64
                    type: integer
                  revisionHash:
                    description: RevisionHash record the hash value of the spec of
                      ApplicationRevision object.
                    type: string
                required:
                - name
                - revision
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
