# CLOMonitor metadata (https://clomonitor.io/docs/topics/checks/).
#
# License scanning results: dependency licenses are checked by the license
# workflow on pull requests targeting master and release-* branches (skipped
# when a pull request only touches documentation or images, which cannot
# change dependencies) and on every push to those branches. license_finder
# validates dependencies against the decisions recorded in
# .license/dependency_decisions.yml and fails the build when an unapproved
# license is introduced. See also docs/dependency-policy.md.
licenseScanning:
  url: https://github.com/kubevela/kubevela/actions/workflows/license.yml
